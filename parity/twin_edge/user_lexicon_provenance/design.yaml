# Twin-edge case: a corpus design whose lexicon is the user's own file, baseline_small's
# forty words. Both engines credited wordfreq for any lexicon a design named, and must
# now name this one by its file name and checksum.
# The word forms are common English words. The Zipf frequencies are invented for this
# fixture and describe no corpus.
name: twin_edge_user_lexicon_provenance
language: english
lexicon: lexicon.csv
description: 'Nouns versus verbs from a lexicon of the user''s own, matched on length.'
n_per_condition: 6
conditions:
  - name: noun
    define_by:
      pos: [noun]
  - name: verb
    define_by:
      pos: [verb]
match_on: [length]
counterbalance:
  lists: 1
