# Twin-edge case: quoted_keys with its response keys unquoted, as most designs write
# them. R's YAML reader followed YAML 1.1 and read an unquoted y and n as the booleans
# TRUE and FALSE, so the R experiments waited for keys named TRUE and FALSE. PyYAML
# keeps both as text. Both engines now read y and n as text, and the experiments are
# those of quoted_keys under this case's name.
# The word forms are common English words. The Zipf frequencies are invented for
# this fixture and describe no corpus.
name: twin_edge_yn_keys
language: english
paradigm: lexical_decision
description: 'Lexical decision on a forty-word lexicon with unquoted y and n response keys.'
items:
  source: generate
  lexicon: lexicon.csv
n_per_condition: 4
pool_filters:
  length: [5, 6]
  frequency: [4.0, 5.0]
events:
  - type: fixation
    content: '+'
    duration_ms: 500
  - type: text
    content: '{target}'
    duration_ms: 800
    trigger: condition
    onset_locked: true
  - type: response
    keys: [y, n]
    timeout_ms: 2000
  - type: blank
    duration_ms: 250
counterbalance:
  lists: 1
