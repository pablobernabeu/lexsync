# Twin-edge case: a generated lexical decision whose pseudowords are also checked
# against a known-form list (items.generation.exclude). Thirty-one Spanish words, thirty
# of them in the length band. Nine of those carry an accent, and the generators now use
# them. One, e-mail, holds a hyphen, which the generators cannot use, so the record must
# count twenty-nine candidates and not the thirty in the band. Before the alphabet came
# from the lexicon, the count was the twenty a-z words. The word forms are common
# Spanish words. The Zipf frequencies are invented for this fixture and describe no
# corpus.
name: twin_edge_generation_exclude
language: spanish
paradigm: lexical_decision
description: 'Six Spanish words and their pseudowords, with a known-form list.'
items:
  source: generate
  lexicon: lexicon.csv
  generation:
    exclude: [known.txt]
n_per_condition: 6
pool_filters:
  length: [4, 7]
