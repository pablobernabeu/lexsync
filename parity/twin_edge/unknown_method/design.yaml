# Twin-edge case: a matching method lexsync does not know is refused by name, not
# replaced by the default.
# The word forms are common English words. The Zipf frequencies are invented for
# this fixture and describe no corpus.
name: twin_edge_unknown_method
language: english
lexicon: lexicon.csv
n_per_condition: 3
conditions:
  - name: noun
    define_by:
      pos: [noun]
  - name: verb
    define_by:
      pos: [verb]
match_on: [length, frequency]
matching:
  method: foo
