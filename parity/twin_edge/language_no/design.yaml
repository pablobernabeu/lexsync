# Twin-edge case: the language written as no, the ISO 639-1 code for Norwegian. YAML
# 1.1 reads an unquoted no as the boolean false in both engines, so the Python engine
# stopped with an error and the R engine wrote its files under a stem ending in false.
# Both now refuse a language that is not text, before anything is written.
# The word forms are common English words. The Zipf frequencies are invented for
# this fixture and describe no corpus.
name: twin_edge_language_no
language: no
lexicon: lexicon.csv
n_per_condition: 3
conditions:
  - name: noun
    define_by:
      pos: [noun]
  - name: verb
    define_by:
      pos: [verb]
match_on: [length, frequency]
