# Twin-edge case: n_per_condition written as the whole float 4.0. YAML reads it as a
# float, which the R engine accepted and the Python engine refused with a TypeError
# inside the matcher. Both now select four sets per condition.
# The word forms are common English words. The Zipf frequencies are invented for
# this fixture and describe no corpus.
name: twin_edge_float_n
language: english
lexicon: lexicon.csv
description: 'Nouns versus verbs, four sets per condition requested as 4.0.'
n_per_condition: 4.0
conditions:
  - name: noun
    define_by:
      pos: [noun]
  - name: verb
    define_by:
      pos: [verb]
match_on: [length, frequency]
counterbalance:
  lists: 2
