<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lexsync: en_supplied_pool</title>
  <!--
    Browser-runnable experiment generated by lexsync.
    Design: en_supplied_pool    Language: english

    Each trial is rendered from the same declarative event list (EVENTS) as the
    PsychoPy and OpenSesame targets; the trial data are embedded (TRIALS), so this
    is a single file that runs by opening it in a browser, with no server. The
    jsPsych library and stylesheet are loaded from a CDN (unpkg), so the machine
    running it needs an internet connection; to run offline, download jspsych@7.3.4,
    the html-keyboard-response plugin and jspsych.css and point the three tags below
    at the local copies. Open it as page.html?participant=3: the embedded trials
    carry every counterbalancing list and the run presents the one list that
    participant is allocated, list 1 when no participant is given. A welcome screen
    precedes the trials and a completion screen follows them. Every recorded row
    carries the item's design fields (condition, item id, counterbalancing list and
    so on) alongside the onset marker (the 'marker' field), so responses can be
    scored without re-joining to the stimulus table.
    When the run finishes the data are offered as a CSV download (jsPsych
    localSave), so no server is required to collect them. A browser cannot drive a
    parallel port, so for online EEG synchronisation route the marker through
    WebSerial / Lab Streaming Layer or a photodiode patch. Generated by lexsync;
    edit the design configuration rather than this file.
  -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    body { background: #000; }
    .lexsync-stim { font-family: "Courier New", monospace; font-size: 48px; color: #fff; }
    .lexsync-note { color: #fff; font-family: sans-serif; font-size: 22px; line-height: 1.5;
                    max-width: 40em; margin: 0 auto; text-align: left; }
    .lexsync-note h1 { font-size: 28px; text-align: center; }
    .lexsync-note code { color: #9cf; }
    .lexsync-note .go { text-align: center; color: #9cf; margin-top: 1.5em; }
  </style>
</head>
<body></body>
<script>
  const EVENTS = [{"type":"fixation","text":"+","ms":500},{"type":"text","field":"word","ms":500,"trigger":"@condition_trigger"},{"type":"response","keys":["arrowleft","arrowright"],"timeout":2},{"type":"blank","ms":250}];
  const TRIALS = [{"trial":1,"list":1,"set":19,"condition":"lower_frequency","word":"torch","condition_trigger":101,"item_trigger":50},{"trial":2,"list":1,"set":8,"condition":"higher_frequency","word":"bottle","condition_trigger":102,"item_trigger":58},{"trial":3,"list":1,"set":16,"condition":"higher_frequency","word":"scale","condition_trigger":102,"item_trigger":47},{"trial":4,"list":1,"set":18,"condition":"higher_frequency","word":"river","condition_trigger":102,"item_trigger":49},{"trial":5,"list":1,"set":16,"condition":"lower_frequency","word":"otter","condition_trigger":101,"item_trigger":47},{"trial":6,"list":1,"set":10,"condition":"lower_frequency","word":"canyon","condition_trigger":101,"item_trigger":41},{"trial":7,"list":1,"set":2,"condition":"higher_frequency","word":"flower","condition_trigger":102,"item_trigger":51},{"trial":8,"list":1,"set":17,"condition":"lower_frequency","word":"banana","condition_trigger":101,"item_trigger":48},{"trial":9,"list":1,"set":12,"condition":"lower_frequency","word":"gravel","condition_trigger":101,"item_trigger":43},{"trial":10,"list":1,"set":1,"condition":"lower_frequency","word":"binder","condition_trigger":101,"item_trigger":40},{"trial":11,"list":1,"set":20,"condition":"higher_frequency","word":"house","condition_trigger":102,"item_trigger":52},{"trial":12,"list":1,"set":6,"condition":"higher_frequency","word":"bread","condition_trigger":102,"item_trigger":56},{"trial":13,"list":1,"set":14,"condition":"lower_frequency","word":"folder","condition_trigger":101,"item_trigger":45},{"trial":14,"list":1,"set":12,"condition":"higher_frequency","word":"valley","condition_trigger":102,"item_trigger":43},{"trial":15,"list":1,"set":2,"condition":"lower_frequency","word":"beaver","condition_trigger":101,"item_trigger":51},{"trial":16,"list":1,"set":13,"condition":"higher_frequency","word":"bridge","condition_trigger":102,"item_trigger":44},{"trial":17,"list":1,"set":5,"condition":"higher_frequency","word":"mirror","condition_trigger":102,"item_trigger":55},{"trial":18,"list":1,"set":11,"condition":"lower_frequency","word":"marble","condition_trigger":101,"item_trigger":42},{"trial":19,"list":1,"set":3,"condition":"higher_frequency","word":"castle","condition_trigger":102,"item_trigger":53},{"trial":20,"list":1,"set":4,"condition":"lower_frequency","word":"timber","condition_trigger":101,"item_trigger":54},{"trial":21,"list":1,"set":7,"condition":"lower_frequency","word":"marker","condition_trigger":101,"item_trigger":57},{"trial":22,"list":1,"set":3,"condition":"lower_frequency","word":"monkey","condition_trigger":101,"item_trigger":53},{"trial":23,"list":1,"set":10,"condition":"higher_frequency","word":"stream","condition_trigger":102,"item_trigger":41},{"trial":24,"list":1,"set":18,"condition":"lower_frequency","word":"scarf","condition_trigger":101,"item_trigger":49},{"trial":25,"list":1,"set":9,"condition":"higher_frequency","word":"orange","condition_trigger":102,"item_trigger":59},{"trial":26,"list":1,"set":14,"condition":"higher_frequency","word":"stone","condition_trigger":102,"item_trigger":45},{"trial":27,"list":1,"set":6,"condition":"lower_frequency","word":"grape","condition_trigger":101,"item_trigger":56},{"trial":28,"list":1,"set":1,"condition":"higher_frequency","word":"butter","condition_trigger":102,"item_trigger":40},{"trial":29,"list":1,"set":7,"condition":"higher_frequency","word":"button","condition_trigger":102,"item_trigger":57},{"trial":30,"list":1,"set":5,"condition":"lower_frequency","word":"chisel","condition_trigger":101,"item_trigger":55},{"trial":31,"list":1,"set":4,"condition":"higher_frequency","word":"temple","condition_trigger":102,"item_trigger":54},{"trial":32,"list":1,"set":15,"condition":"lower_frequency","word":"lagoon","condition_trigger":101,"item_trigger":46},{"trial":33,"list":1,"set":19,"condition":"higher_frequency","word":"table","condition_trigger":102,"item_trigger":50},{"trial":34,"list":1,"set":11,"condition":"higher_frequency","word":"forest","condition_trigger":102,"item_trigger":42},{"trial":35,"list":1,"set":17,"condition":"higher_frequency","word":"engine","condition_trigger":102,"item_trigger":48},{"trial":36,"list":1,"set":20,"condition":"lower_frequency","word":"glove","condition_trigger":101,"item_trigger":52},{"trial":37,"list":1,"set":9,"condition":"lower_frequency","word":"candle","condition_trigger":101,"item_trigger":59},{"trial":38,"list":1,"set":13,"condition":"lower_frequency","word":"carrot","condition_trigger":101,"item_trigger":44},{"trial":39,"list":1,"set":15,"condition":"higher_frequency","word":"window","condition_trigger":102,"item_trigger":46},{"trial":40,"list":1,"set":8,"condition":"lower_frequency","word":"shovel","condition_trigger":101,"item_trigger":58}];
  // A filename for the saved data, derived from the page title so no design value
  // is interpolated into JavaScript; non-filename characters become underscores.
  const DATA_FILE = document.title.replace(/[^A-Za-z0-9_.-]+/g, "_") + ".csv";

  const jsPsych = initJsPsych();

  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function stim(s) { return '<span class="lexsync-stim">' + htmlEscape(s) + '</span>'; }
  function resolveTrigger(spec, trial) {
    if (spec === undefined || spec === null) return null;
    if (typeof spec === "string" && spec[0] === "@") return parseInt(trial[spec.slice(1)], 10);
    return parseInt(spec, 10);
  }
  function content(ev, trial) { return ("field" in ev) ? trial[ev.field] : (ev.text || ""); }

  // The participant this run is for, from the page's ?participant=N query, and the one
  // counterbalancing list they are presented. TRIALS carries every list, because the
  // same page serves every participant; running it whole would present each item once
  // per list, which for a rotated design means each item once in every condition,
  // exactly the repetition the counterbalancing exists to prevent. Participant p is
  // given the pth list, cycling, the allocation lexsync's participant_table writes.
  function participantNumber() {
    const raw = parseInt(new URLSearchParams(window.location.search).get("participant"), 10);
    return isFinite(raw) && raw > 0 ? raw : 1;
  }
  function listKey(value) {
    const n = parseInt(value, 10);
    return String(n) === String(value) ? [0, n, ""] : [1, 0, String(value)];
  }
  function trialsForParticipant(trials, participant) {
    const seen = {};
    trials.forEach(t => { seen[String(t.list === undefined ? 1 : t.list)] = 1; });
    const lists = Object.keys(seen).sort((a, b) => {
      const ka = listKey(a), kb = listKey(b);
      return ka[0] - kb[0] || ka[1] - kb[1] || (ka[2] < kb[2] ? -1 : ka[2] > kb[2] ? 1 : 0);
    });
    if (lists.length < 2) return trials.slice();
    const wanted = lists[(participant - 1) % lists.length];
    return trials.filter(t => String(t.list === undefined ? 1 : t.list) === wanted);
  }

  const PARTICIPANT = participantNumber();
  const RUN_TRIALS = trialsForParticipant(TRIALS, PARTICIPANT);

  // The response keys the participant will use, gathered from the events so the
  // welcome screen can name them.
  function responseKeys() {
    const keys = [];
    const seen = {};
    const add = k => { if (!(k in seen)) { seen[k] = 1; keys.push(k); } };
    for (const ev of EVENTS) {
      if (ev.type === "response" || ev.type === "question") (ev.keys || []).forEach(add);
      if (ev.type === "region") add(ev.key || " ");
    }
    return keys;
  }
  function keyLabel(k) { return k === " " ? "space bar" : k.replace(/^arrow/i, "").toLowerCase(); }

  const timeline = [];

  // Welcome and instructions. The keys are described only if the task asks for a
  // response, so a passive-reading design does not mention a keyboard.
  (function () {
    const keys = responseKeys();
    const n = RUN_TRIALS.length;
    let body = "<h1>Welcome</h1><p>Thank you for taking part. In this task you will see "
      + "items presented one at a time on the screen.</p>";
    if (keys.length)
      body += "<p>When a response is needed, use the "
        + keys.map(keyLabel).map(l => "<b>" + htmlEscape(l) + "</b>").join(" and ")
        + " key" + (keys.length > 1 ? "s" : "")
        + ". Please respond as quickly and accurately as you can.</p>";
    body += "<p>There " + (n === 1 ? "is 1 item" : "are " + n + " items") + " in total.</p>"
      + "<p class='go'>Press the space bar to begin.</p>";
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<div class='lexsync-note'>" + body + "</div>",
      choices: [" "],
      data: { lexsync_event: "instructions" }
    });
  })();

  // Whether an event runs on a given trial. An event may name the blocks it belongs to;
  // feedback during practice and not during the main task is the case this exists for.
  function eventApplies(ev, trial) {
    if (!ev.blocks || !ev.blocks.length) return true;
    return ev.blocks.map(String).indexOf(String(trial.block || "main")) !== -1;
  }

  let previousBlock = null;
  let trialCounter = 0;
  for (const trial of RUN_TRIALS) {
    // Identifies this trial's rows in the data store. A feedback screen has to score the
    // key pressed on ITS OWN trial, and eventApplies can drop a response event from a
    // block, so a trial can reach feedback with no response row of its own. Reading "the
    // last scored row" would then silently score the previous trial's keypress; keying
    // on the loop position reports no response instead, which is the honest outcome.
    const trialUid = ++trialCounter;
    // A pause wherever the block changes. Unlike the PsychoPy and OpenSesame runners,
    // which decide this at run time from the loop table, the browser timeline is built
    // here and now, so the break is simply inserted where the boundary is.
    const thisBlock = String(trial.block || "main");
    if (previousBlock !== null && thisBlock !== previousBlock) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<div class='lexsync-note'>"
          + (thisBlock === "main"
             ? "<h1>End of practice</h1><p>The practice trials are over. The task itself "
               + "begins now.</p>"
             : "<h1>Pause</h1><p>Take a short break if you need one.</p>")
          + "<p class='go'>Press the space bar to continue.</p></div>",
        choices: [" "],
        data: { lexsync_event: "block_break", block: thisBlock }
      });
    }
    previousBlock = thisBlock;

    // Attach the item's fields to every recorded row (spread first, so the event's
    // own keys below always win on any name clash).
    for (const ev of EVENTS) {
      if (!eventApplies(ev, trial)) {
        continue;
      } else if (ev.type === "feedback") {
        // The item's `answer` column holds the KEY that is correct, so scoring is a
        // string comparison. jsPsych records the pressed key on the preceding response
        // trial, so the verdict is computed when this screen is built, from the data
        // store rather than from a variable threaded through the loop.
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          choices: "NO_KEYS",
          trial_duration: ev.ms || 0,
          stimulus: function () {
            const scored = jsPsych.data.get().filter({ lexsync_scored: trialUid })
              .last(1).values();
            const pressed = scored.length ? scored[0].response : null;
            const want = String(trial[ev.answer] === undefined ? "" : trial[ev.answer]).trim();
            const text = (pressed === null || pressed === undefined)
              ? (ev.no_response || "Too slow")
              : (String(pressed).trim() === want ? (ev.correct || "Correct")
                                                 : (ev.incorrect || "Incorrect"));
            return stim(text);
          },
          data: Object.assign({}, trial, { lexsync_event: "feedback" })
        });
      } else if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) })
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: "blank" })
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: Object.assign({}, trial, {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          })
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          // lexsync_scored carries this trial's id, so a feedback screen finds the
          // response for ITS trial rather than whatever screen ran last.
          data: Object.assign({}, trial, { lexsync_event: "response", lexsync_scored: trialUid })
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: Object.assign({}, trial, { lexsync_event: "question", lexsync_scored: trialUid })
        });
      }
    }
  }

  // Completion: save the collected data as a CSV download (no server needed) and
  // thank the participant. on_load fires as the screen appears, so every trial
  // above is already in the data store.
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "<div class='lexsync-note'><h1>All done</h1>"
      + "<p>The task is complete. Your data file (<code>" + htmlEscape(DATA_FILE)
      + "</code>) has been saved to your downloads folder. You may now close this "
      + "window.</p></div>",
    choices: "NO_KEYS",
    on_load: function () { jsPsych.data.get().localSave("csv", DATA_FILE); }
  });

  jsPsych.run(timeline);
</script>
</html>
