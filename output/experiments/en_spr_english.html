    Design: en_spr    Language: english

    Each trial is rendered from the same declarative event list (EVENTS) as the
    PsychoPy and OpenSesame targets; trial data are embedded (TRIALS), so this is
    a single self-contained file. Onset markers are written into each trial's data
    (the 'marker' field); a browser cannot drive a parallel port, so for online
    EEG synchronisation route the marker through WebSerial / Lab Streaming Layer or
    a photodiode patch. Generated by lexsync; edit the design configuration rather

wer": "f", "condition_trigger": 102, "item_trigger": 48}, {"trial": 9, "list": 1, "set": 8, "condition": "ungrammatical", "sentence": "The|captain|of the ships|were|brave.", "question": "Was someone brave?", "critical_region": 4, "answer": "f", "condition_trigger": 101, "item_trigger": 48}, {"trial": 10, "list": 1, "set": 5, "condition": "grammatical", "sentence": "The|picture|of the children|was|lovely.", "question": "Was something lovely?", "critical_region": 4, "answer": "f", "condition_trigger": 102, "item_trigger": 45}, {"trial": 10, "list": 2, "set": 9, "condition": "ungrammatical", "sentence": "The|letter|from the lawyers|were|urgent.", "question": "Was the letter urgent?", "critical_region": 4, "answer": "f", "condition_trigger": 101, "item_trigger": 49}];
  const FRAME_MS = 1000 / 60;

  const jsPsych = initJsPsych();

  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function stim(s) { return '<span class="lexsync-stim">' + htmlEscape(s) + '</span>'; }
  function resolveTrigger(spec, trial) {
    if (spec === undefined || spec === null) return null;
    if (typeof spec === "string" && spec[0] === "@") return parseInt(trial[spec.slice(1)], 10);
    return parseInt(spec, 10);
  }
  function content(ev, trial) { return ("field" in ev) ? trial[ev.field] : (ev.text || ""); }

  const timeline = [];
  for (const trial of TRIALS) {
    for (const ev of EVENTS) {
      if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS),
          data: { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) }
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS)
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          }
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: { lexsync_event: "response" }
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: { lexsync_event: "question" }
        });
      }
    }
  }

  jsPsych.run(timeline);
</script>
