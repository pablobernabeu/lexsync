    return (value === undefined || value === null || value === "") ? 1 : Number(value);
  }

  // The version this run presents, from the page's address: ?version=K, ?list=K when
  // the versions do not span several replicates, or ?participant=N, whose version is
  // ((N - 1) mod V) + 1, the rule lexsync's participant_table() allocates by. Only
  // whole numbers from 1 are accepted. A static page cannot count its participants,
  // so a study run without participant numbers hands out one ?version= link per
  // version.
  function chooseVersion() {
    const n = VERSIONS.length;
    if (!n) return { error: "This experiment holds no trials." };
    const usage = "Open this page with ?participant=N for participant number N, or with "
      + "?version=K for K from 1 to " + n + ".";
    const params = new URLSearchParams(window.location.search);
    const read = {};
    for (const name of ["participant", "version", "list"]) {
      const raw = params.get(name);
      if (raw === null || raw === "") continue;
      if (!/^\d+$/.test(raw) || parseInt(raw, 10) < 1)
        return { error: "The address gives " + name + "=" + raw + ", but " + name
                   + " takes a whole number from 1. " + usage };
      read[name] = parseInt(raw, 10);
    }
    let chosen;
    if (read.version !== undefined) {
      if (read.version > n)
        return { error: "The address asks for version " + read.version + ", but this "
                   + "experiment has " + (n === 1 ? "one version" : n + " versions") + ". "
                   + usage };
      chosen = VERSIONS[read.version - 1];
    } else if (read.list !== undefined) {
      if (new Set(VERSIONS.map(v => v.replicate)).size > 1)
        return { error: "This experiment's versions span several replicates, so a list "
                   + "does not name one. " + usage };
      chosen = VERSIONS.find(v => v.list === read.list);
      if (!chosen)
        return { error: "The address asks for list " + read.list + ", which this "
                   + "experiment does not have. " + usage };
    } else if (read.participant !== undefined) {
      chosen = VERSIONS[(read.participant - 1) % n];
    } else if (n === 1) {
      chosen = VERSIONS[0];
    } else {
      return { error: "This experiment has " + n + " versions, and each participant runs "
                 + "one of them. " + usage };
    }
    return { version: chosen, participant: read.participant };
  }

  const RUN = chooseVersion();
  const RUN_TRIALS = TRIALS.filter(t => !RUN.error
    && whole(t.replicate) === RUN.version.replicate && whole(t.list) === RUN.version.list);
  // A filename for the saved data, derived from the page title and the run's
  // participant and version, so no design value is interpolated into JavaScript;
  // non-filename characters become underscores.
  const DATA_FILE = document.title.replace(/[^A-Za-z0-9_.-]+/g, "_")
    + (RUN.participant === undefined ? "" : "_p" + RUN.participant)
    + (RUN.error ? "" : "_v" + RUN.version.version) + ".csv";

  const jsPsych = initJsPsych();
  if (!RUN.error) {
    // Every recorded row says which participant and version it came from.
    const run = { version: RUN.version.version, replicate: RUN.version.replicate,
                  list: RUN.version.list };
    if (RUN.participant !== undefined) run.participant = RUN.participant;
    jsPsych.data.addProperties(run);
  }

  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function stim(s) { return '<span class="lexsync-stim">' + htmlEscape(s) + '</span>'; }
  function resolveTrigger(spec, trial) {
    if (spec === undefined || spec === null) return null;
    if (typeof spec === "string" && spec[0] === "@") return parseInt(trial[spec.slice(1)], 10);
    return parseInt(spec, 10);
  }
  // The text an event shows on a trial, in the letter case its `case` asks for. The case
  // is applied here, as the screen is built, and never by lexsync, whose R engine
  // upper-cases some letters differently (the German sharp s stays as it is in R and
  // becomes "SS" here). The data rows keep the item as it was written.
  function content(ev, trial) {
    const text = String(("field" in ev) ? trial[ev.field] : (ev.text || ""));
    if (ev.case === "upper") return text.toUpperCase();
    if (ev.case === "lower") return text.toLowerCase();
    return text;
  }

  const timeline = [];

  // Welcome and instructions, then a wait for the space bar. The instructions are data,
  // escaped here, with each line break kept. Without a version to run, the page says how
  // to open it instead, and nothing else runs.
  (function () {
    if (RUN.error) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<div class='lexsync-note'><h1>No version chosen</h1><p>"
          + htmlEscape(RUN.error) + "</p></div>",
        choices: "NO_KEYS",
        data: { lexsync_event: "version_error" }
      });
      return;
    }
    const n = RUN_TRIALS.length;
    const text = String(INSTRUCTIONS[RUN.version.version - 1] || "");
    const body = "<h1>Welcome</h1><p>Thank you for taking part.</p><p>"
      + htmlEscape(text).split("\n").join("<br>") + "</p>"
      + "<p>There " + (n === 1 ? "is 1 item" : "are " + n + " items") + " in total.</p>"
      + "<p class='go'>Press the space bar to begin.</p>";
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<div class='lexsync-note'>" + body + "</div>",
      choices: [" "],
      data: { lexsync_event: "instructions" }
    });
  })();

  // Whether an event runs on a given trial. An event may name the blocks it belongs to;
  // feedback during practice and not during the main task is the case this exists for.
  function eventApplies(ev, trial) {
    if (!ev.blocks || !ev.blocks.length) return true;
    return ev.blocks.map(String).indexOf(String(trial.block || "main")) !== -1;
  }

  // The run of trials a trial belongs to, which a pause separates from the next: its
  // block, except that a filler belongs to the main trials' run. Fillers are interleaved
  // with the main trials so that nothing sets them apart, and a pause before and after
  // each one would do just that.
  function trialRun(trial) {
    const block = String(trial.block || "main");
    return block === "filler" ? "main" : block;
  }

  let previousRun = null;
  let trialCounter = 0;
  for (const trial of RUN_TRIALS) {
    // Identifies this trial's rows in the data store. A feedback screen has to score the
    // key pressed on ITS OWN trial, and eventApplies can drop a response event from a
    // block, so a trial can reach feedback with no response row of its own. Reading "the
    // last scored row" would then silently score the previous trial's keypress; keying
    // on the loop position reports no response instead, which is the honest outcome.
    const trialUid = ++trialCounter;
    // A pause wherever the run of trials changes, which is where the practice trials
    // end. Unlike the PsychoPy runner, which decides this at run time from the loop
    // table, the browser timeline is built here and now, so the break is simply inserted
    // where the boundary is.
    const thisRun = trialRun(trial);
    if (previousRun !== null && thisRun !== previousRun) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<div class='lexsync-note'>"
          + (thisRun === "main"
             ? "<h1>End of practice</h1><p>The practice trials are over. The task itself "
               + "begins now.</p>"
             : "<h1>Pause</h1><p>Take a short break if you need one.</p>")
          + "<p class='go'>Press the space bar to continue.</p></div>",
        choices: [" "],
        data: { lexsync_event: "block_break", block: thisRun }
      });
    }
    previousRun = thisRun;

    // Attach the item's fields to every recorded row (spread first, so the event's
    // own keys below always win on any name clash).
    for (const ev of EVENTS) {
      if (!eventApplies(ev, trial)) {
        continue;
      } else if (ev.type === "feedback") {
        // The item's `answer` column holds the KEY that is correct, so scoring is a
        // string comparison. jsPsych records the pressed key on the preceding response
        // trial, so the verdict is computed when this screen is built, from the data
        // store rather than from a variable threaded through the loop.
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          choices: "NO_KEYS",
          trial_duration: ev.ms || 0,
          stimulus: function () {
            const scored = jsPsych.data.get().filter({ lexsync_scored: trialUid })
              .last(1).values();
            const pressed = scored.length ? scored[0].response : null;
            const want = String(trial[ev.answer] === undefined ? "" : trial[ev.answer]).trim();
            const text = (pressed === null || pressed === undefined)
              ? (ev.no_response || "Too slow")
              : (String(pressed).trim() === want ? (ev.correct || "Correct")
                                                 : (ev.incorrect || "Incorrect"));
            return stim(text);
          },
          data: Object.assign({}, trial, { lexsync_event: "feedback" })
        });
      } else if (ev.respond) {
        // The stimulus collects its own response, from its onset: it is shown for its
        // duration at most, the trial runs on for the timeout after it, and a key ends
        // the trial. jsPsych times rt from the onset. lexsync_scored lets a feedback
        // screen find this row, as it found the separate response row.
        const ms = ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0);
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.respond.keys,
          stimulus_duration: ms,
          trial_duration: ms + Math.round(ev.respond.timeout * 1000),
          response_ends_trial: true,
          data: Object.assign({}, trial, { lexsync_event: "target",
                                           marker: resolveTrigger(ev.trigger, trial),
                                           lexsync_scored: trialUid })
        });
      } else if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) })
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: "blank" })
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: Object.assign({}, trial, {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          })
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          // lexsync_scored carries this trial's id, so a feedback screen finds the
          // response for ITS trial rather than whatever screen ran last.
          data: Object.assign({}, trial, { lexsync_event: "response", lexsync_scored: trialUid })
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: Object.assign({}, trial, { lexsync_event: "question", lexsync_scored: trialUid })
        });
      }
    }
  }

  // Completion: save the collected data as a CSV download (no server needed) and
  // thank the participant. on_load fires as the screen appears, so every trial
  // above is already in the data store.
  if (!RUN.error) timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "<div class='lexsync-note'><h1>All done</h1>"
      + "<p>The task is complete. Your data file (<code>" + htmlEscape(DATA_FILE)
      + "</code>) has been saved to your downloads folder. You may now close this "
      + "window.</p></div>",
    choices: "NO_KEYS",
    on_load: function () { jsPsych.data.get().localSave("csv", DATA_FILE); }
  });

  jsPsych.run(timeline);
</script>
</html>
