<!DOCTYPE html>
<html lang="english">
<head>
  <meta charset="UTF-8">
  <title>lexsync: en_priming</title>
  <!--
    Browser-runnable experiment generated by lexsync.
    Design: en_priming    Language: english

    Each trial is rendered from the same declarative event list (EVENTS) as the
    PsychoPy and OpenSesame targets; trial data are embedded (TRIALS), so this is
    a single self-contained file. Onset markers are written into each trial's data
    (the 'marker' field); a browser cannot drive a parallel port, so for online
    EEG synchronisation route the marker through WebSerial / Lab Streaming Layer or
    a photodiode patch. Generated by lexsync; edit the design configuration rather
    than this file.
  -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
  <style>
    body { background: #000; }
    .lexsync-stim { font-family: "Courier New", monospace; font-size: 48px; color: #fff; }
  </style>
</head>
<body></body>
<script>
  const EVENTS = [{"type": "fixation", "text": "+", "frames": 30}, {"type": "text", "field": "prime", "frames": 3, "trigger": 20}, {"type": "mask", "text": "#####", "frames": 2}, {"type": "text", "field": "target", "frames": 48, "trigger": "@condition_trigger"}, {"type": "response", "keys": ["arrowleft", "arrowright"], "timeout": 2.0}, {"type": "blank", "frames": 15}];
  const TRIALS = [{"trial": 1, "list": 1, "set": 7, "condition": "related", "prime": "butter", "target": "bread", "condition_trigger": 101, "item_trigger": 49}, {"trial": 1, "list": 2, "set": 9, "condition": "unrelated", "prime": "river", "target": "black", "condition_trigger": 102, "item_trigger": 51}, {"trial": 2, "list": 2, "set": 4, "condition": "related", "prime": "saucer", "target": "cup", "condition_trigger": 101, "item_trigger": 46}, {"trial": 2, "list": 1, "set": 2, "condition": "unrelated", "prime": "cloud", "target": "hand", "condition_trigger": 102, "item_trigger": 44}, {"trial": 3, "list": 1, "set": 10, "condition": "unrelated", "prime": "chair", "target": "moon", "condition_trigger": 102, "item_trigger": 41}, {"trial": 3, "list": 2, "set": 8, "condition": "related", "prime": "cold", "target": "hot", "condition_trigger": 101, "item_trigger": 50}, {"trial": 4, "list": 2, "set": 6, "condition": "related", "prime": "queen", "target": "king", "condition_trigger": 101, "item_trigger": 48}, {"trial": 4, "list": 1, "set": 9, "condition": "related", "prime": "white", "target": "black", "condition_trigger": 101, "item_trigger": 51}, {"trial": 5, "list": 1, "set": 12, "condition": "unrelated", "prime": "carpet", "target": "day", "condition_trigger": 102, "item_trigger": 43}, {"trial": 5, "list": 2, "set": 11, "condition": "unrelated", "prime": "engine", "target": "salt", "condition_trigger": 102, "item_trigger": 42}, {"trial": 6, "list": 2, "set": 1, "condition": "unrelated", "prime": "window", "target": "doctor", "condition_trigger": 102, "item_trigger": 40}, {"trial": 6, "list": 1, "set": 1, "condition": "related", "prime": "nurse", "target": "doctor", "condition_trigger": 101, "item_trigger": 40}, {"trial": 7, "list": 1, "set": 3, "condition": "related", "prime": "south", "target": "north", "condition_trigger": 101, "item_trigger": 45}, {"trial": 7, "list": 2, "set": 5, "condition": "unrelated", "prime": "table", "target": "cat", "condition_trigger": 102, "item_trigger": 47}, {"trial": 8, "list": 2, "set": 10, "condition": "related", "prime": "star", "target": "moon", "condition_trigger": 101, "item_trigger": 41}, {"trial": 8, "list": 1, "set": 4, "condition": "unrelated", "prime": "tractor", "target": "cup", "condition_trigger": 102, "item_trigger": 46}, {"trial": 9, "list": 2, "set": 12, "condition": "related", "prime": "night", "target": "day", "condition_trigger": 101, "item_trigger": 43}, {"trial": 9, "list": 1, "set": 6, "condition": "unrelated", "prime": "pencil", "target": "king", "condition_trigger": 102, "item_trigger": 48}, {"trial": 10, "list": 1, "set": 8, "condition": "unrelated", "prime": "paper", "target": "hot", "condition_trigger": 102, "item_trigger": 50}, {"trial": 10, "list": 2, "set": 2, "condition": "related", "prime": "foot", "target": "hand", "condition_trigger": 101, "item_trigger": 44}, {"trial": 11, "list": 2, "set": 7, "condition": "unrelated", "prime": "planet", "target": "bread", "condition_trigger": 102, "item_trigger": 49}, {"trial": 11, "list": 1, "set": 5, "condition": "related", "prime": "dog", "target": "cat", "condition_trigger": 101, "item_trigger": 47}, {"trial": 12, "list": 1, "set": 11, "condition": "related", "prime": "pepper", "target": "salt", "condition_trigger": 101, "item_trigger": 42}, {"trial": 12, "list": 2, "set": 3, "condition": "unrelated", "prime": "lemon", "target": "north", "condition_trigger": 102, "item_trigger": 45}];
  const FRAME_MS = 1000 / 60;

  const jsPsych = initJsPsych();

  function htmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function stim(s) { return '<span class="lexsync-stim">' + htmlEscape(s) + '</span>'; }
  function resolveTrigger(spec, trial) {
    if (spec === undefined || spec === null) return null;
    if (typeof spec === "string" && spec[0] === "@") return parseInt(trial[spec.slice(1)], 10);
    return parseInt(spec, 10);
  }
  function content(ev, trial) { return ("field" in ev) ? trial[ev.field] : (ev.text || ""); }

  const timeline = [];
  for (const trial of TRIALS) {
    for (const ev of EVENTS) {
      if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS),
          data: { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) }
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS)
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          }
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: { lexsync_event: "response" }
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: { lexsync_event: "question" }
        });
      }
    }
  }

  jsPsych.run(timeline);
</script>
</html>
