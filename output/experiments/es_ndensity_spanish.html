    // on the loop position reports no response instead, which is the honest outcome.
    const trialUid = ++trialCounter;
    // A pause wherever the block changes. Unlike the PsychoPy and OpenSesame runners,
    // which decide this at run time from the loop table, the browser timeline is built
    // here and now, so the break is simply inserted where the boundary is.
    const thisBlock = String(trial.block || "main");
    if (previousBlock !== null && thisBlock !== previousBlock) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<div class='lexsync-note'>"
          + (thisBlock === "main"
             ? "<h1>End of practice</h1><p>The practice trials are over. The task itself "
               + "begins now.</p>"
             : "<h1>Pause</h1><p>Take a short break if you need one.</p>")
          + "<p class='go'>Press the space bar to continue.</p></div>",
        choices: [" "],
        data: { lexsync_event: "block_break", block: thisBlock }
      });
    }
    previousBlock = thisBlock;

    // Attach the item's fields to every recorded row (spread first, so the event's
    // own keys below always win on any name clash).
    for (const ev of EVENTS) {
      if (!eventApplies(ev, trial)) {
        continue;
      } else if (ev.type === "feedback") {
        // The item's `answer` column holds the KEY that is correct, so scoring is a
        // string comparison. jsPsych records the pressed key on the preceding response
        // trial, so the verdict is computed when this screen is built, from the data
        // store rather than from a variable threaded through the loop.
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          choices: "NO_KEYS",
          trial_duration: ev.ms || 0,
          stimulus: function () {
            const scored = jsPsych.data.get().filter({ lexsync_scored: trialUid })
              .last(1).values();
            const pressed = scored.length ? scored[0].response : null;
            const want = String(trial[ev.answer] === undefined ? "" : trial[ev.answer]).trim();
            const text = (pressed === null || pressed === undefined)
              ? (ev.no_response || "Too slow")
              : (String(pressed).trim() === want ? (ev.correct || "Correct")
                                                 : (ev.incorrect || "Incorrect"));
            return stim(text);
          },
          data: Object.assign({}, trial, { lexsync_event: "feedback" })
        });
      } else if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) })
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: ev.ms_column ? Number(trial[ev.ms_column]) : (ev.ms || 0),
          data: Object.assign({}, trial, { lexsync_event: "blank" })
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: Object.assign({}, trial, {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          })
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          // lexsync_scored carries this trial's id, so a feedback screen finds the
          // response for ITS trial rather than whatever screen ran last.
          data: Object.assign({}, trial, { lexsync_event: "response", lexsync_scored: trialUid })
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: Object.assign({}, trial, { lexsync_event: "question", lexsync_scored: trialUid })
        });
      }
    }
  }

  // Completion: save the collected data as a CSV download (no server needed) and
  // thank the participant. on_load fires as the screen appears, so every trial
  // above is already in the data store.
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "<div class='lexsync-note'><h1>All done</h1>"
      + "<p>The task is complete. Your data file (<code>" + htmlEscape(DATA_FILE)
      + "</code>) has been saved to your downloads folder. You may now close this "
      + "window.</p></div>",
    choices: "NO_KEYS",
    on_load: function () { jsPsych.data.get().localSave("csv", DATA_FILE); }
  });

  jsPsych.run(timeline);
</script>
</html>
