  }
  function content(ev, trial) { return ("field" in ev) ? trial[ev.field] : (ev.text || ""); }

  // The response keys the participant will use, gathered from the events so the
  // welcome screen can name them.
  function responseKeys() {
    const keys = [];
    const seen = {};
    const add = k => { if (!(k in seen)) { seen[k] = 1; keys.push(k); } };
    for (const ev of EVENTS) {
      if (ev.type === "response" || ev.type === "question") (ev.keys || []).forEach(add);
      if (ev.type === "region") add(ev.key || " ");
    }
    return keys;
  }
  function keyLabel(k) { return k === " " ? "space bar" : k.replace(/^arrow/i, "").toLowerCase(); }

  const timeline = [];

  // Welcome and instructions. The keys are described only if the task asks for a
  // response, so a passive-reading design does not mention a keyboard.
  (function () {
    const keys = responseKeys();
    const n = TRIALS.length;
    let body = "<h1>Welcome</h1><p>Thank you for taking part. In this task you will see "
      + "items presented one at a time on the screen.</p>";
    if (keys.length)
      body += "<p>When a response is needed, use the "
        + keys.map(keyLabel).map(l => "<b>" + htmlEscape(l) + "</b>").join(" and ")
        + " key" + (keys.length > 1 ? "s" : "")
        + ". Please respond as quickly and accurately as you can.</p>";
    body += "<p>There " + (n === 1 ? "is 1 item" : "are " + n + " items") + " in total.</p>"
      + "<p class='go'>Press the space bar to begin.</p>";
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<div class='lexsync-note'>" + body + "</div>",
      choices: [" "],
      data: { lexsync_event: "instructions" }
    });
  })();

  for (const trial of TRIALS) {
    // Attach the item's fields to every recorded row (spread first, so the event's
    // own keys below always win on any name clash).
    for (const ev of EVENTS) {
      if (ev.type === "fixation" || ev.type === "text" || ev.type === "mask") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS),
          data: Object.assign({}, trial, { lexsync_event: ev.type, marker: resolveTrigger(ev.trigger, trial) })
        });
      } else if (ev.type === "blank") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "", choices: "NO_KEYS",
          trial_duration: Math.round((ev.frames || 1) * FRAME_MS),
          data: Object.assign({}, trial, { lexsync_event: "blank" })
        });
      } else if (ev.type === "region") {
        const regions = String(trial[ev.field]).split(ev.sep || "|").filter(r => r !== "");
        const crit = parseInt(trial.critical_region || 0, 10);
        regions.forEach((region, i) => timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(region),
          choices: [ev.key || " "],
          data: Object.assign({}, trial, {
            lexsync_event: "region", region_index: i + 1,
            marker: (i + 1 === crit) ? resolveTrigger(ev.crit_trigger, trial) : null
          })
        }));
      } else if (ev.type === "response") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse, stimulus: "",
          choices: ev.keys || ["ArrowLeft", "ArrowRight"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: Object.assign({}, trial, { lexsync_event: "response" })
        });
      } else if (ev.type === "question") {
        timeline.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: stim(content(ev, trial)),
          choices: ev.keys || ["f", "j"],
          trial_duration: ev.timeout ? Math.round(ev.timeout * 1000) : null,
          data: Object.assign({}, trial, { lexsync_event: "question" })
        });
      }
    }
  }

  // Completion: save the collected data as a CSV download (no server needed) and
  // thank the participant. on_load fires as the screen appears, so every trial
  // above is already in the data store.
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: "<div class='lexsync-note'><h1>All done</h1>"
      + "<p>The task is complete. Your data file (<code>" + htmlEscape(DATA_FILE)
      + "</code>) has been saved to your downloads folder. You may now close this "
      + "window.</p></div>",
    choices: "NO_KEYS",
    on_load: function () { jsPsych.data.get().localSave("csv", DATA_FILE); }
  });

  jsPsych.run(timeline);
</script>
</html>
