# Demonstration design: Spanish high- versus low-frequency contrast.
name: es_freqcontrast
language: spanish
lexicon: corpora/derived/es.csv
description: 'High versus low frequency Spanish words, matched on length, neighbourhood density and OLD20.'
n_per_condition: 30
pool_filters:
  length: [3, 8]
  frequency: [3.8, 7.0]
conditions:
  - name: high_frequency
    define_by:
      frequency: [5.2, 7.0]
  - name: low_frequency
    define_by:
      frequency: [3.8, 4.4]
match_on: [length, n_density, old20]
counterbalance:
  lists: 1
timing:
  fixation_frames: 30
  word_frames: 30
  isi_frames: 15
