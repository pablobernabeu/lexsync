# Demonstration paradigm: English lexical decision with Wuggy-style pseudowords.
# Identical to design_en_lexdec.yaml but the pseudowords are generated by the
# subsyllabic method: each real word is split into onset/nucleus/coda constituents
# and whole constituents are swapped for attested same-role, same-length
# alternatives, so the pseudowords preserve syllabic structure (a deterministic
# orthographic approximation of Wuggy; Keuleers & Brysbaert, 2010). The selection
# is byte-identical across the R and Python engines. Set
# items.generation.method to letter_substitution (the default) for the simpler
# single-letter-substitution generator.
name: en_lexdec_wuggy
language: english
paradigm: lexical_decision
description: 'Lexical decision with subsyllabic (Wuggy-style) pseudowords: real words versus length-matched pseudowords built by swapping whole onset/nucleus/coda constituents.'
items:
  source: generate
  lexicon: corpora/derived/en_v2.csv
  generation:
    method: subsyllabic
    # Every English form wordfreq lists at Zipf 1 or above, so that no pseudoword is a
    # real word too rare for the lexicon.
    exclude: [corpora/derived/en_known_forms.txt]
n_per_condition: 60
pool_filters:
  length: [4, 7]
  frequency: [3.5, 6.0]
  # Keeps only the forms the SUBTLEX-US screen leaves unmarked (see corpora/ATTRIBUTION.md).
  nonstandard: [0, 0]
# Leaves out the unsuitable forms the screen lets through (see the file's header).
exclude_words: {path: config/exclude_en_demo.txt}
counterbalance:
  lists: 1
timing:
  fixation_frames: 30
  word_frames: 48
  isi_frames: 15
