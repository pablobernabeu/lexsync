# Demonstration paradigm: English lexical decision.
# Real words (a frequency band) are contrasted with length-matched, orthographically
# legal pseudowords generated deterministically by constrained letter substitution.
# Lexicality is checked against the reference lexicon only, since the design names
# no items.generation.exclude list, so a form missing from it may still be a word.
# The most bigram-typical candidate wins, so the pseudowords are more bigram-typical
# than their words (d about -1.5, words minus pseudowords). The presented string is
# the 'target'; conditions are 'word' and 'pseudoword'; each word is paired with its
# pseudoword by 'set'. Trial events: fixation -> target (onset-locked condition
# marker) -> response -> blank.
name: en_lexdec
language: english
paradigm: lexical_decision
description: 'Lexical decision: real words versus length-matched, orthographically legal pseudowords (deterministically generated).'
items:
  source: generate
  lexicon: corpora/derived/en.csv
n_per_condition: 60
pool_filters:
  length: [4, 7]
  frequency: [3.5, 6.0]
counterbalance:
  lists: 1
timing:
  fixation_frames: 30
  word_frames: 48
  isi_frames: 15
