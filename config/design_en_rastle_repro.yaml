# Reproducing a published design.
#
# Rastle, Davis & New (2004), "The broth in my brother's brothel", used masked
# priming to dissociate three kinds of prime-target relationship at a stem:
#   - transparent morphological (cleaner-CLEAN): shares form, morphology AND meaning;
#   - opaque   morphological (corner-CORN):     shares form and APPARENT morphology
#                                               (an -er ending) but not meaning;
#   - orthographic / form    (brothel-BROTH):   shares form only, with no morpheme
#                                               boundary and no meaning.
# Their result (equal priming for transparent and opaque, none for form) argued
# for an early morpho-orthographic decomposition stage blind to meaning.
#
# lexsync reproduces the item-selection structure of the design, not the masked-
# priming task. Each target appears with a related prime (of its assigned
# prime_type) and an unrelated, length-matched control, and Latin-square
# counterbalancing ensures a target is seen once per list. prime_type
# (transparent | opaque | form) is the between-items factor carried for analysis.
# The trials come from lexsync's priming paradigm, which is backward pattern-masked
# with no forward mask, and the design has no nonword targets, so it is not a
# lexical-decision task. This is a representative item set following the
# prime-type STRUCTURE of Rastle et al. (2004), not their materials: they used 150
# prime-target pairs, 50 per condition, each target also appearing with an
# unrelated control prime, plus 50 filler word pairs and 200 nonword targets.
name: en_rastle_repro
language: english
paradigm: priming
description: 'Reproducing the item-selection structure of Rastle, Davis & New (2004): transparent, opaque and orthographic (form) prime-target relationships, each against an unrelated baseline, presented with the backward-masked priming paradigm and no nonword targets, so not their masked-priming lexical-decision task; Latin-square counterbalanced over two lists.'
items:
  source: table
  path: items/rastle_priming_en.csv
counterbalance:
  lists: 2
