# Reproducing a published design.
#
# Rastle, Davis & New (2004), "The broth in my brother's brothel", used masked
# priming to dissociate three kinds of prime-target relationship at a stem:
#   - transparent morphological (cleaner-CLEAN): shares form, morphology AND meaning;
#   - opaque   morphological (corner-CORN):     shares form and APPARENT morphology
#                                               (an -er ending) but not meaning;
#   - orthographic / form    (brothel-BROTH):   shares form only, with no morpheme
#                                               boundary and no meaning.
# Their result (equal priming for transparent and opaque, none for form) argued
# for an early morpho-orthographic decomposition stage blind to meaning.
#
# lexsync expresses the design with its priming paradigm: each target appears with a
# related prime (of its assigned prime_type) and an unrelated, length-matched control.
# Latin-square counterbalancing ensures a target is seen once per list. prime_type
# (transparent | opaque | form) is the between-items factor carried for analysis.
# This is a representative item set following the prime-type STRUCTURE of Rastle et
# al. (2004), not their full 840-prime materials.
name: en_rastle_repro
language: english
paradigm: priming
description: 'Reproducing Rastle, Davis & New (2004): masked priming contrasting transparent, opaque and orthographic (form) prime-target relationships, each against an unrelated baseline; Latin-square counterbalanced over two lists.'
items:
  source: table
  path: items/rastle_priming_en.csv
counterbalance:
  lists: 2
