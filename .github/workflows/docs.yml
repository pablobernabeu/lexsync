# Builds the documentation for both packages: the pkgdown reference under /r,
# the mkdocs reference under /python, the hub landing page at the root and the
# generated jsPsych experiments under /demos. A pull request builds the site
# without publishing it, so that a change that breaks the build shows before the
# merge. Only a push to main, or 'Run workflow' on main, publishes it to GitHub
# Pages.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'R_workflow/**'
      - 'python_workflow/**'
      # The demos are staged straight from the committed artefacts, so a design or
      # corpus change can alter what the site publishes without touching either
      # package.
      - 'output/experiments/**'
      # The design configurations name the published demos, and the changelog is
      # embedded verbatim into the Python site's changelog page by a pymdownx
      # snippet. Without these two the site can lag a committed change.
      - 'config/design_*.yaml'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
      # The demos index is generated by this script during the build, so an edit
      # to it alone changes a published page. Without it here, that edit would
      # sit unpublished until some other path happened to trigger a rebuild.
      - '.github/build_demo_index.py'
  pull_request:
    paths:
      - 'R_workflow/**'
      - 'python_workflow/**'
      - 'output/experiments/**'
      - 'config/design_*.yaml'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
      - '.github/build_demo_index.py'
  workflow_dispatch:

# The build reads the repository, and only the deploy job writes, to gh-pages.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pandoc renders the vignettes, from which pkgdown builds the Get started page,
      # the Articles menu and the About page.
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: R_workflow
          extra-packages: any::pkgdown, local::.

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site("R_workflow", new_process = FALSE, install = FALSE)'

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the full
        # text built from LICENSE.md. Only the full-text page, the one the footer
        # and the home sidebar link, stays live, and the markdown copy that
        # pkgdown leaves beside the stub goes too. The rest of the family prunes
        # it here as well.
        #
        # The sitemap entry goes with the page. pkgdown writes sitemap.xml before
        # this step runs, so deleting the page alone would leave a <loc> for a URL
        # that answers 404, and search engines read the sitemap and would follow
        # it. pkgdown writes one <url> per line, so a line filter removes exactly
        # that entry.
        run: |
          rm -f R_workflow/docs/LICENSE-text.html R_workflow/docs/LICENSE-text.md
          if [ -f R_workflow/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' R_workflow/docs/sitemap.xml > R_workflow/docs/sitemap.new || true
            if [ -s R_workflow/docs/sitemap.new ]; then
              mv R_workflow/docs/sitemap.new R_workflow/docs/sitemap.xml
            else
              rm -f R_workflow/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r R_workflow/docs site/r

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Build mkdocs site
        run: |
          python -m pip install --quiet -e ./python_workflow "mkdocs-material" "mkdocstrings[python]" "markdown-exec>=1.12.3"
          cd python_workflow && mkdocs build --strict -d ../site/python

      - name: Write landing page
        # 404.html at the published root is the file GitHub Pages serves for
        # every URL that matches nothing on the site. Without it, visitors get
        # GitHub's generic 404 with no way back to the documentation.
        run: |
          cp R_workflow/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      # The browser experiments are committed artefacts of the pipeline, so this
      # stages them rather than rebuilding: running the pipeline here would risk
      # publishing something other than what the repository records. The landing
      # page and the mkdocs header's Demo link both resolve into this directory.
      - name: Stage the generated jsPsych experiments under site/demos
        run: |
          mkdir -p site/demos
          cp output/experiments/*.html site/demos/

      # GitHub Pages serves no directory listing, so without this only the demos
      # linked from the landing page are reachable and the rest are published but
      # invisible. The index is generated from the design configurations rather
      # than written by hand, so it cannot fall behind the set of designs.
      - name: Build an index for the published demos
        run: python .github/build_demo_index.py

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Writes the site to the gh-pages branch, the only write in the workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

  sidebar-doi:
    name: The R site's sidebar shows the DOI once, as a link
    # pkgdown copies the README's DOI badge into Dev status, where
    # pkgdown/extra.scss hides it, and the Citation component gives the DOI as a
    # link. This fails if pkgdown's markup or the compiled stylesheet stops
    # matching those rules, which would bring the duplicate back. It runs beside
    # the deploy job, so that a failure marks the run red without holding the
    # site back.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Check the DOI in the sidebar
        run: python3 .github/check_doi_display.py --site site/r --package R_workflow
