# Builds the documentation for both packages and deploys them as one site:
# the pkgdown reference under /r, the mkdocs reference under /python, the hub
# landing page at the root, and the generated jsPsych experiments under /demos.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'R_workflow/**'
      - 'python_workflow/**'
      # The demos are staged straight from the committed artefacts, so a design or
      # corpus change can alter what the site publishes without touching either
      # package.
      - 'output/experiments/**'
      # The design configurations name the published demos, and the changelog is
      # embedded verbatim into the Python site's changelog page by a pymdownx
      # snippet. Without these two the site can lag a committed change.
      - 'config/design_*.yaml'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
      # The demos index is generated by this script during the build, so an edit
      # to it alone changes a published page. Without it here, that edit would
      # sit unpublished until some other path happened to trigger a rebuild.
      - '.github/build_demo_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pandoc renders the vignette, which pkgdown turns into the Articles tab.
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399  # v2.13.0
        with:
          working-directory: R_workflow
          extra-packages: any::pkgdown, local::.

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site("R_workflow", new_process = FALSE, install = FALSE)'

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the full
        # text built from LICENSE.md. Keep only the full-text page live -- the one
        # the footer and the home sidebar link -- and drop the markdown copy
        # pkgdown leaves beside the stub. The rest of the family prunes it here too.
        #
        # The sitemap entry goes with the page. pkgdown writes sitemap.xml before
        # this step runs, so deleting the page alone would leave a <loc> advertising
        # a URL that 404s -- and a sitemap is read by search engines, which is the
        # one audience that would then follow it. pkgdown emits one <url> per line,
        # so a line filter removes exactly that entry.
        run: |
          rm -f R_workflow/docs/LICENSE-text.html R_workflow/docs/LICENSE-text.md
          if [ -f R_workflow/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' R_workflow/docs/sitemap.xml > R_workflow/docs/sitemap.new || true
            if [ -s R_workflow/docs/sitemap.new ]; then
              mv R_workflow/docs/sitemap.new R_workflow/docs/sitemap.xml
            else
              rm -f R_workflow/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r R_workflow/docs site/r

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build mkdocs site
        run: |
          python -m pip install --quiet -e ./python_workflow "mkdocs-material" "mkdocstrings[python]" "markdown-exec"
          cd python_workflow && mkdocs build --strict -d ../site/python

      - name: Write landing page
        # 404.html at the published root is the file GitHub Pages serves for
        # every URL that matches nothing on the site; without it visitors get
        # GitHub's generic 404 with no way back to the documentation.
        run: |
          cp R_workflow/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      # The browser experiments are committed artefacts of the pipeline, so this
      # stages them rather than rebuilding: running the pipeline here would risk
      # publishing something other than what the repository records. The landing
      # page and the mkdocs header's Demo link both resolve into this directory.
      - name: Stage the generated jsPsych experiments under site/demos
        run: |
          mkdir -p site/demos
          cp output/experiments/*.html site/demos/

      # GitHub Pages serves no directory listing, so without this only the demos
      # linked from the landing page are reachable and the rest are published but
      # invisible. The index is generated from the design configurations rather
      # than written by hand, so it cannot fall behind the set of designs.
      - name: Build an index for the published demos
        run: python .github/build_demo_index.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
