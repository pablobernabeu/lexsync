# R CMD check for the lexsync R package (in R_workflow/), on the platforms and R
# versions CRAN tests on.
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # regenerate-outputs.yaml starts this on the commit it pushes, which a push
  # made with GITHUB_TOKEN would not.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - { os: windows-latest, r: 'devel' }
          - { os: ubuntu-latest,  r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'oldrel-1' }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: R_workflow

      # CRAN's Linux hosts check each package beside the unpacked sources of the
      # others, so a test that walks up out of lexsync.Rcheck meets directories named
      # templates/ or config/ that belong to unrelated packages. 0.1.0 failed there
      # exactly so. These stand-ins give the check directory the same neighbours; a
      # test that takes any of them for the repository fails here, not on CRAN.
      - name: Seed the check directory with CRAN-like neighbours
        shell: bash
        working-directory: R_workflow
        run: |
          mkdir -p check/templates/R check/config
          printf 'Package: templates\nVersion: 0.3.0\n' > check/templates/DESCRIPTION
          printf 'addAttr <- function(x) x\n' > check/templates/R/addAttr.R
          printf 'Package: config\nVersion: 0.3.2\n' > check/config/DESCRIPTION
          printf '# Another project\n' > check/README.md

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: R_workflow
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      # Every leg above runs in a UTF-8 locale. CRAN's checks also run in
      # other locales, such as Latin-9 (en_US.iso885915), where a string not
      # marked as UTF-8 is read as Latin-9, which no UTF-8 leg can show. So the
      # Linux R-devel leg runs the tests once more from the sources in that
      # locale, with NOT_CRAN unset, as CRAN runs them. The first line of the R
      # code stops the step if the locale did not take.
      - name: Tests in a Latin-9 locale
        if: runner.os == 'Linux' && matrix.config.r == 'devel'
        shell: bash
        run: |
          sudo localedef -i en_US -f ISO-8859-15 en_US.iso885915
          env -u NOT_CRAN LANG=en_US.iso885915 LC_ALL=en_US.iso885915 Rscript -e '
            stopifnot(identical(l10n_info()$codeset, "ISO-8859-15"))
            pkgload::load_all("R_workflow", quiet = TRUE)
            invisible(testthat::test_dir("R_workflow/tests/testthat", stop_on_failure = TRUE))
          '

  # roxygen2 rewrites NAMESPACE only when the file still carries its header, so a
  # NAMESPACE that has lost that line is skipped in silence and an added @export
  # never reaches the committed file. The test suite cannot see that happen:
  # testthat runs inside the package namespace, where an unexported function is
  # just as visible as an exported one. roxygen2 also writes the help pages in
  # man/ from the roxygen comments, and CRAN builds the manual from the committed
  # files, so a comment edited without devtools::document() never reaches a user.
  # Regenerating both and comparing them with the committed files is the only
  # check that sees either.
  #
  # roxygen2 is pinned below, and the job stops if DESCRIPTION records another
  # version, so a roxygen2 release cannot turn this job red with no change to the
  # sources. The help is regenerated in a UTF-8 locale, as on a developer's
  # machine.
  #
  # It sits outside the matrix above. Regenerating the same files on six
  # platforms is waste, and a failure inside the matrix would read as a platform
  # problem rather than as files someone forgot to regenerate.
  namespace:
    runs-on: ubuntu-latest
    name: NAMESPACE and man/ are current
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: R_workflow
          # roxygen2 is pinned to the version DESCRIPTION records, so that a new
          # roxygen2 release cannot turn this job red with no source change. Move
          # the pin and Config/roxygen2/version in R_workflow/DESCRIPTION together.
          # The version must be written without the any:: prefix: pak reads
          # any::roxygen2@8.0.0 as any version of roxygen2 and drops the pin.
          extra-packages: roxygen2@8.0.0

      - name: Check the roxygen2 version and the NAMESPACE header
        shell: Rscript {0}
        run: |
          installed <- as.character(utils::packageVersion("roxygen2"))
          cat("roxygen2 ", installed, "\n", sep = "")

          desc <- read.dcf("R_workflow/DESCRIPTION")
          # roxygen2 8 records the generating version under Config/roxygen2/version,
          # and 7 and earlier wrote RoxygenNote. Accept whichever field is present.
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(desc))
          if (length(field) > 0) {
            recorded <- unname(desc[1, field[1]])
            cat("R_workflow/DESCRIPTION records ", field[1], " ", recorded, "\n", sep = "")
            if (!identical(installed, recorded)) {
              cat(sprintf(paste0(
                "::error file=.github/workflows/R-CMD-check.yaml::roxygen2 %s is installed but ",
                "R_workflow/DESCRIPTION records %s. A NAMESPACE difference now would show the ",
                "version gap rather than a stale file, so this job stops here. Move the roxygen2 ",
                "pin in .github/workflows/R-CMD-check.yaml and %s in R_workflow/DESCRIPTION to the ",
                "same version.\n"), installed, recorded, field[1]))
              quit(status = 1)
            }
          }

          # Without this the gate would pass on the very defect it exists for:
          # roxygen2 leaves a NAMESPACE it did not write alone and exits cleanly,
          # so the file would stay stale and the diff below would stay empty.
          first <- c(readLines("R_workflow/NAMESPACE", n = 1, warn = FALSE), "")[1]
          if (!grepl("^# Generated by roxygen2", first)) {
            cat(paste0(
              "::error file=R_workflow/NAMESPACE::R_workflow/NAMESPACE has lost its ",
              "\"# Generated by roxygen2: do not edit by hand\" first line. roxygen2 will not ",
              "overwrite a NAMESPACE it did not write, so devtools::document(\"R_workflow\") is ",
              "silently doing nothing to this file. Restore that first line and run ",
              "devtools::document(\"R_workflow\").\n"))
            quit(status = 1)
          }

      - name: Regenerate NAMESPACE and man/ from the roxygen comments
        shell: Rscript {0}
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: roxygen2::roxygenise("R_workflow", roclets = c("namespace", "rd"))

      # The diff and any new Rd file are printed to the log, so that the change
      # can be read from the run without downloading anything.
      - name: Fail if the committed NAMESPACE or man/ is stale
        run: |
          changes=$(git status --porcelain --untracked-files=all -- R_workflow/NAMESPACE R_workflow/man)
          if [ -z "$changes" ]; then
            echo 'R_workflow/NAMESPACE and R_workflow/man are current.'
          else
            echo "$changes"
            git --no-pager diff -- R_workflow/NAMESPACE R_workflow/man
            git ls-files --others --exclude-standard -- R_workflow/man | while read -r f; do
              echo "New file $f:"
              cat "$f"
            done
            echo "::error file=R_workflow/NAMESPACE::R_workflow/NAMESPACE or R_workflow/man does not match the roxygen comments in R_workflow/R/. The diff above is what roxygen2 would write. Run devtools::document(\"R_workflow\") and commit R_workflow/NAMESPACE and R_workflow/man."
            exit 1
          fi

  # The matrix above reaches down only to oldrel-1. This job tests R 4.1, the
  # oldest R the package supports, with the hard dependencies as CRAN serves them
  # today. It installs the package, which parses the help pages and byte-compiles
  # and lazy-loads the code on that R, then runs the test suite from the sources.
  # It is not a second `--as-cran` check, so it does not show that the package
  # passes CRAN's checks there. Suggests are not part of the promise DESCRIPTION
  # makes, so they are left out, and the tests that need one skip themselves.
  # DESCRIPTION declared R 4.0.0 until this job showed that current releases of
  # readr, a hard dependency, and of testthat need R 4.1 (run 43721438825 on
  # 6e62be5).
  r-minimum:
    name: R (declared minimum, 4.1)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: '4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat, any::pkgload
          working-directory: R_workflow

      - name: Install the package
        run: R CMD INSTALL R_workflow

      - name: Tests
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          pkgload::load_all("R_workflow", quiet = TRUE)
          res <- testthat::test_dir("R_workflow/tests/testthat", stop_on_failure = TRUE)
          invisible(res)
