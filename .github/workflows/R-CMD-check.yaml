# R CMD check for the lexsync R package (in R_workflow/), on the platforms and R
# versions CRAN tests on. Addresses the cross-platform gap once the repo is pushed.
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - { os: windows-latest, r: 'devel' }
          - { os: ubuntu-latest,  r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'oldrel-1' }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399  # v2.13.0

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: R_workflow

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          working-directory: R_workflow
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  # roxygen2 rewrites NAMESPACE only when the file still carries its header, so a
  # NAMESPACE that has lost that line is skipped in silence and an added @export
  # never reaches the committed file. The test suite cannot see that happen:
  # testthat runs inside the package namespace, where an unexported function is
  # just as visible as an exported one. This job is the only check that would.
  #
  # It gates NAMESPACE and nothing else. Rd formatting churns between roxygen2
  # releases, so gating man/ as well would make the job red on version drift far
  # more often than on a stale file, and a flaky gate stops being read.
  #
  # It also sits outside the matrix above. Regenerating the same file on six
  # platforms is waste, and a failure inside the matrix would read as a platform
  # problem rather than as a file someone forgot to regenerate.
  namespace:
    runs-on: ubuntu-latest
    name: NAMESPACE is current
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          working-directory: R_workflow
          # roxygen2 is pinned to the version DESCRIPTION records, so that a new
          # roxygen2 release cannot turn this job red with no source change. Move
          # the pin and Config/roxygen2/version in R_workflow/DESCRIPTION together.
          # The version must be written without the any:: prefix: pak reads
          # any::roxygen2@8.0.0 as any version of roxygen2 and drops the pin.
          extra-packages: roxygen2@8.0.0

      - name: Check the roxygen2 version and the NAMESPACE header
        shell: Rscript {0}
        run: |
          installed <- as.character(utils::packageVersion("roxygen2"))
          cat("roxygen2 ", installed, "\n", sep = "")

          desc <- read.dcf("R_workflow/DESCRIPTION")
          # roxygen2 8 records the generating version under Config/roxygen2/version;
          # 7 and earlier wrote RoxygenNote. Accept whichever field is present.
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(desc))
          if (length(field) > 0) {
            recorded <- unname(desc[1, field[1]])
            cat("R_workflow/DESCRIPTION records ", field[1], " ", recorded, "\n", sep = "")
            if (!identical(installed, recorded)) {
              cat(sprintf(paste0(
                "::error file=.github/workflows/R-CMD-check.yaml::roxygen2 %s is installed but ",
                "R_workflow/DESCRIPTION records %s. A NAMESPACE difference now would show the ",
                "version gap rather than a stale file, so this job stops here. Move the roxygen2 ",
                "pin in .github/workflows/R-CMD-check.yaml and %s in R_workflow/DESCRIPTION to the ",
                "same version.\n"), installed, recorded, field[1]))
              quit(status = 1)
            }
          }

          # Without this the gate would pass on the very defect it exists for:
          # roxygen2 leaves a NAMESPACE it did not write alone and exits cleanly,
          # so the file would stay stale and the diff below would stay empty.
          first <- c(readLines("R_workflow/NAMESPACE", n = 1, warn = FALSE), "")[1]
          if (!grepl("^# Generated by roxygen2", first)) {
            cat(paste0(
              "::error file=R_workflow/NAMESPACE::R_workflow/NAMESPACE has lost its ",
              "\"# Generated by roxygen2: do not edit by hand\" first line. roxygen2 will not ",
              "overwrite a NAMESPACE it did not write, so devtools::document(\"R_workflow\") is ",
              "silently doing nothing to this file. Restore that first line and run ",
              "devtools::document(\"R_workflow\").\n"))
            quit(status = 1)
          }

      - name: Regenerate NAMESPACE
        run: Rscript -e 'roxygen2::roxygenise("R_workflow", roclets = "namespace")'

      - name: Fail if the committed NAMESPACE is stale
        run: |
          if ! git diff --exit-code -- R_workflow/NAMESPACE; then
            echo "::error file=R_workflow/NAMESPACE::R_workflow/NAMESPACE does not match the @export and @importFrom tags in R_workflow/R/. The diff above is what roxygen2 would write. Run devtools::document(\"R_workflow\") and commit R_workflow/NAMESPACE."
            exit 1
          fi
