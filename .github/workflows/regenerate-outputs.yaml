name: regenerate-outputs

# Regenerates output/ and the twin-edge expectations under parity/twin_edge/ with
# both engines, in the environment the committed datasheets record: Windows,
# R 4.6.1 with the R package versions below, and Python 3.13.7 with the pins in
# python_workflow/requirements.txt. It then runs both test suites and the engine
# comparisons on the result, commits it to the branch it ran on and starts the
# CI workflows on that commit, because a push made with GITHUB_TOKEN starts none.
#
# A push to any branch but main whose commit message contains
# '[regenerate outputs]' starts it, and so does a manual run on such a branch.
# It never pushes to main: open a pull request with the regenerated commit.

on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: regenerate-outputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: >-
      github.ref_name != 'main' && github.ref_name != 'master' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[regenerate outputs]'))
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Every datasheet records the SHA-256 of the files the run read and wrote,
      # so a CRLF checkout would record digests that no LF checkout reproduces.
      - name: Check that the checkout has LF line endings
        run: |
          git ls-files --eol config/schema.yaml
          git ls-files --eol config/schema.yaml | grep -q 'w/lf'

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      # The versions the R datasheets record. Another version would still run,
      # but every R datasheet would then record it.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: R_workflow
          extra-packages: |
            any::testthat
            local::.
            readr@2.2.0
            stringdist@0.9.17
            jsonlite@2.0.0
            digest@0.6.39
            yaml@2.3.12
            stringi@1.8.7

      - name: Report the R environment
        run: |
          Rscript -e 'cat(R.version.string, "\n"); for (p in c("lexsync", "readr", "stringdist", "jsonlite", "digest", "yaml", "stringi")) cat(p, format(packageVersion(p)), "\n")'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.7'

      - name: Install the pinned Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_workflow/requirements.txt
          python -m pip install -c python_workflow/requirements.txt -e "python_workflow[dev]"
          python --version
          python -m pip freeze | grep -E '^(pandas|numpy|scipy|rapidfuzz|PyYAML)=='

      # The Python datasheets record the version importlib.metadata reports, so
      # a stale installed distribution would make them name the wrong release.
      - name: Check that both engines report the version in DESCRIPTION
        run: |
          want=$(sed -n 's/^Version: *//p' R_workflow/DESCRIPTION)
          have_py=$(python -c "import importlib.metadata as m; print(m.version('lexsync'))")
          have_r=$(Rscript -e 'cat(format(packageVersion("lexsync")))')
          echo "DESCRIPTION $want, Python $have_py, R $have_r"
          test "$have_py" = "$want" && test "$have_r" = "$want"

      # R first, then Python, never at the same time: both write the same
      # experiment files.
      - name: Regenerate with the R engine
        run: Rscript R_workflow/run_pipeline.R

      - name: Regenerate with the Python engine
        run: python python_workflow/run_pipeline.py

      - name: Update the twin-edge expectations
        run: |
          # Only cases whose outcome is 'artefacts' have expected files: a refusal
          # case pins the refusal in its expect.yaml, which --update leaves alone.
          python tools/twin_edge.py --update $(python tools/twin_edge.py --list | awk -F': ' '$2 == "artefacts" {print $1}')

      - name: Fail if a selection changed
        run: git diff --exit-code -- output/stimuli/

      - name: Check what the datasheets record
        run: |
          python - <<'EOF'
          import collections, glob, json, re
          want = re.search(r"^Version: *(\S+)", open("R_workflow/DESCRIPTION", encoding="utf-8").read(), re.M).group(1)
          seen = collections.Counter()
          for path in glob.glob("output/reports/*_datasheet_*.json"):
              v = json.load(open(path, encoding="utf-8"))["reproducibility"]["versions"]
              seen[(v["engine"], v["lexsync"], v.get("R") or v.get("python"), v["os"])] += 1
              assert v["lexsync"] == want, (path, v["lexsync"])
          for key, n in sorted(seen.items()):
              print(n, key)
          EOF

      - name: Run the R suite from the source tree
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_local("R_workflow", reporter = "summary"));
                      cat(sprintf("FAIL %d | WARN %d | SKIP %d | PASS %d\n", sum(res$failed), sum(res$warning), sum(res$skipped), sum(res$passed)));
                      if (sum(res$failed) > 0) stop("R test failures");
                      if (sum(res$warning) > 0) stop("R test warnings")'

      - name: Run the Python suite
        working-directory: python_workflow
        run: python -m pytest -q

      - name: Compare the engines on the demonstration designs
        run: python tools/compare_engines.py

      - name: Compare the engines on the twin-edge cases
        run: python tools/compare_engines.py --config parity/twin_edge

      - name: Commit and push the regenerated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short | sed 's|^\(...\)\([^/]*/[^/]*\).*|\2|' | sort | uniq -c
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -F - <<EOF
          Regenerate the outputs with R 4.6.1 and Python 3.13.7 on Windows

          The regenerate-outputs workflow wrote this commit from ${GITHUB_SHA}
          (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          Both engines regenerated every demonstration design and the Python
          engine every twin-edge case. Both test suites and the engine
          comparisons passed on the result.
          EOF
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Start CI on the regenerated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in R-CMD-check.yaml python-tests.yaml test-coverage.yaml doi-display.yaml; do
            gh workflow run "$wf" --ref "${GITHUB_REF_NAME}" || echo "::warning::could not start $wf"
          done
