# pytest for the lexsync Python package (in python_workflow/) across the
# supported Python versions and three operating systems.
name: python-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python_workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Build and check the distribution
        run: |
          python -m build
          python -m twine check dist/*
