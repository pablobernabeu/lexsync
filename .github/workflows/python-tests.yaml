# pytest for the lexsync Python package (in python_workflow/) across the
# supported Python versions and three operating systems, plus the cross-engine
# parity gate, which is the only job that runs both engines against each other.
name: python-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Mondays at 06:00 UTC: the matrix installs whatever pip resolves on the day,
  # so a weekly run catches a breaking dependency release even while the
  # repository itself is quiet.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: python_workflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pytest-cov is installed here rather than in the dev extras because it is
      # a CI reporting concern, not something the suite needs to run locally.
      - name: Install the package with dev extras
        run: python -m pip install -e ".[dev]" pytest-cov

      - name: Run the test suite
        run: python -m pytest -q --cov=lexsync --cov-report=term --cov-report=json

      - name: Write the coverage percentage to the run summary
        # coverage.json is the machine-readable twin of the terminal report the
        # step above already printed. Reading the percentage from it here puts
        # one headline figure on the run's summary page, so nobody has to dig
        # through the pytest log to learn it. No external service is involved.
        # The shell is pinned because this matrix includes Windows, where the
        # default is pwsh and a heredoc would not parse.
        shell: bash
        run: |
          python - <<'EOF'
          import json, os
          pct = round(json.load(open("coverage.json"))["totals"]["percent_covered"], 1)
          print("Test coverage: %s%%" % pct)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a") as f:
                  f.write("## Python test coverage: **%s%%**\n" % pct)
          EOF

      # A test that writes into the tracked tree leaves every later `git status`
      # dirty and gets its churn swept into the next commit, which is how 42 run
      # logs full of fresh timestamps were committed twice. Tests write to a temp
      # directory; this is what keeps it that way.
      # git diff is repo-wide whatever directory it runs from, and it reports only
      # tracked files, so the editable install's egg-info cannot trip it.
      - name: Fail if the test suite modified any tracked file
        run: git diff --exit-code

      - name: Build and check the distribution
        run: |
          python -m build
          python -m twine check dist/*

      # Everything above runs from the checkout, where a datum missing from the
      # wheel is masked by the repository copy sitting next to it. Prove the wheel
      # alone suffices: install it into a bare venv, leave the checkout, and run a
      # real design offline (the design, the corpus it references and the schema
      # are copied in first). One leg is enough; the wheel is pure Python.
      - name: Smoke-test the built wheel outside the checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/corpora/derived"
          cp "$GITHUB_WORKSPACE/config/design_en_freqcontrast.yaml" "$RUNNER_TEMP/config/"
          cp "$GITHUB_WORKSPACE/config/schema.yaml" "$RUNNER_TEMP/config/"
          cp "$GITHUB_WORKSPACE/corpora/derived/en.csv" "$RUNNER_TEMP/corpora/derived/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'EOF'
          from importlib.resources import files
          import lexsync
          schema = files("lexsync") / "data" / "schema.yaml"
          assert schema.is_file(), "the bundled schema is missing from the wheel"
          EOF
          "$RUNNER_TEMP/wheel-venv/bin/lexsync" run config/design_en_freqcontrast.yaml --outdir out
          test -f out/stimuli/en_freqcontrast_english_stimuli_py.csv

  # The parity suite compares the Python engine against output/stimuli/*_R.csv.
  # Run on a single platform: parity is a property of the two engines, not of the
  # operating system, and this is the one job that needs both toolchains.
  parity:
    runs-on: ubuntu-latest
    name: R <-> Python parity
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # slugify() must fold case identically whatever the locale, because base
      # tolower() maps "I" to a dotless "i" under Turkish and would take a design's
      # slug out of ASCII. The test that proves it needs the locale to exist, and a
      # bare runner has only C and en_US, so it skipped here and guarded nothing.
      - name: Generate the Turkish locale the slugify test needs
        run: sudo locale-gen tr_TR.UTF-8 && sudo update-locale

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # `local::.`, not `local::./R_workflow`: working-directory already places the
          # action in R_workflow, so the longer form resolved to R_workflow/R_workflow,
          # failed at the dependency-install step and took the job down with it. Every
          # parity step below was then SKIPPED rather than run, so the gate that
          # enforces the byte-identity claim stopped executing while the badge merely
          # went red. docs.yml has always used the short form.
          working-directory: R_workflow
          extra-packages: |
            any::testthat
            local::.

      # R CMD check runs the suite from an installed copy, where the repository
      # files are absent and every repo-coupled test skips itself. Running the
      # suite once from the source tree is what actually exercises them, so
      # assert none of them skipped rather than trusting a green tick.
      - name: Run the R suite from the source tree
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_local("R_workflow", reporter = "summary"));
                      cat(sprintf("FAIL %d | SKIP %d | PASS %d\n", sum(res$failed), sum(res$skipped), sum(res$passed)));
                      if (sum(res$failed) > 0) stop("R test failures");
                      if (sum(res$skipped) > 0) stop("A repo-coupled R test skipped; it is guarding nothing here.")'

      # Same rule as the Python matrix: a suite that writes into the tracked tree
      # dirties every later git status. This has to come BEFORE the deliberate
      # regeneration below, which rewrites the run logs with fresh timestamps by
      # design.
      - name: Fail if the R suite modified any tracked file
        run: git diff --exit-code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the Python package with dev extras
        run: python -m pip install -e "./python_workflow[dev]"

      - name: Regenerate the R reference stimuli
        run: Rscript R_workflow/run_pipeline.R

      # Without this the parity gate would only ever compare Python against a
      # frozen snapshot, so an R-engine regression could not fail CI.
      - name: Fail if the regenerated R references drifted from the committed ones
        run: git diff --exit-code -- output/stimuli/

      - name: Compare the engines
        env:
          LEXSYNC_REQUIRE_PARITY: '1'
        run: python -m pytest tests/test_parity.py -q
        working-directory: python_workflow

      # Both engines write experiments to the same paths, so a diff against the
      # committed tree only ever compares the last engine to run against itself. Run
      # each into its own directory and compare the whole generated trees: the
      # keyed-hash shuffle makes the trial order itself engine-identical, so every
      # generated file, stimuli, reports and scripts alike, must match byte for
      # byte. Two accommodations: the datasheets and run logs are per-engine
      # provenance records (each names its own engine), so they are excluded; and
      # the CSVs carry an engine tag in their names (_R/_py), which would leave
      # diff -r nothing to pair, so the tags are stripped first.
      - name: Fail if the two engines generated different artefacts
        run: |
          Rscript -e 'library(lexsync); run_all("config", "config/schema.yaml", "/tmp/eng_r")'
          python -c "from lexsync.run_pipeline import run_all; run_all('config','config/schema.yaml','/tmp/eng_py')"
          for f in /tmp/eng_r/*/*_R.csv; do mv "$f" "${f%_R.csv}.csv"; done
          for f in /tmp/eng_py/*/*_py.csv; do mv "$f" "${f%_py.csv}.csv"; done
          diff -r -x '*_datasheet_*' -x '*_run_log_*' /tmp/eng_r /tmp/eng_py \
            || { echo "::error::the engines generated different artefacts"; exit 1; }

  # Every other job installs whatever pip resolves on the day, so the floors
  # declared in pyproject.toml are never actually exercised and could rot
  # unnoticed. This job installs them exactly, on the oldest supported
  # interpreter. A failure here is the job doing its work: it means the floors
  # in pyproject.toml need raising to the oldest versions the suite really
  # supports, not that this job should be softened or skipped.
  minimum-versions:
    runs-on: ubuntu-latest
    name: Minimum supported dependency versions
    defaults:
      run:
        working-directory: python_workflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # The floors go in first and the package follows with --no-deps, so pip
      # cannot quietly upgrade any of them while resolving the package. pytest is
      # installed on its own line because --no-deps would strip its dependencies.
      - name: Install the declared dependency floors, then the package
        run: |
          python -m pip install "pandas==1.5.*" "numpy==1.23.*" "PyYAML==6.0.*" "rapidfuzz==3.0.*" "scipy==1.9.*"
          python -m pip install --no-deps -e .
          python -m pip install pytest

      - name: Run the test suite against the floors
        run: python -m pytest -q
