# Build and publish the Python package to PyPI through trusted publishing
# (OIDC), so no API token is ever stored in the repository.
#
# One-time setup on PyPI: add this repository as a pending publisher for the
# lexsync project (owner "pablobernabeu", repository "lexsync", workflow file
# "publish.yml", environment "pypi"). The first upload creates the project and
# makes the publisher permanent. Until then a pending publisher does not reserve
# the name, and PyPI deletes it if it is still unused 30 days after it was
# added, so add it shortly before the release that will use it. If it has
# lapsed, the upload fails with "invalid-publisher": add it again and re-run the
# failed publish job.
#
# The workflow runs when a GitHub release is published. The manual trigger lets
# a version reach PyPI from its tag before the GitHub release is published, so
# Zenodo, which archives the release, never records "on PyPI" before it is true.
# It also retries a release whose run is past GitHub's 30-day re-run window. A
# manual run must be started on the release tag, and the check below refuses a
# branch.
#
# The test suite is not repeated here. python-tests.yaml already runs pytest
# across five interpreters and three operating systems, builds the distribution,
# runs twine check over it and installs the wheel into a bare venv outside the
# checkout on every push. Duplicating any of that at release time would only
# create a second copy to keep in step with the first.
name: Publish to PyPI

# Read-only at the workflow level: the build job only checks out and builds, and
# without this line it would inherit whatever the repository default happens to
# be, which on many repositories is read/write on contents. The publish job
# re-declares the one elevation it needs, the OIDC id-token, at the job level,
# and a job-level block replaces this one entirely rather than adding to it.
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A version number can never be reused on PyPI. Uploading 0.1.0 from a
      # release tagged v0.1.1 burns 0.1.0 permanently, and the only remedy is to
      # yank it and move on to the next number, so the mismatch is caught here
      # before anything is built rather than after it is public. None of the four
      # sibling packages has this check; lexsync is where it starts.
      #
      # The tag reaches the script through the environment rather than being
      # interpolated into the shell command, because a release tag is
      # user-supplied text and `${{ }}` inside a run block is substituted before
      # bash ever sees it.
      #
      # Both `v0.1.0` and `0.1.0` are accepted. Requiring one form would only mean
      # a release cut in the other form fails for a reason that has nothing to do
      # with the version being wrong.
      #
      # The tag comes from github.ref_name, which a release event and a manual
      # run on a tag both set, so the check runs under both triggers. A manual
      # run on a branch is refused outright: it would build whatever version the
      # branch carries, with no tag, no GitHub release and no Zenodo record, and
      # the pypi environment has no rule of its own to stop it.
      - name: Fail unless the run is on a tag that matches pyproject.toml
        working-directory: python_workflow
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          if os.environ["REF_TYPE"] != "tag":
              sys.exit(
                  "This workflow publishes only from a release tag. Start a manual run "
                  "on the tag (gh workflow run publish.yml --ref v0.1.1), not on a branch."
              )
          tag = os.environ["REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if declared != tag:
              sys.exit(
                  "pyproject.toml declares version %s but the run is on tag %s. "
                  "Fix whichever is wrong and tag again; a version uploaded under "
                  "the wrong number cannot be reused on PyPI."
                  % (declared, tag)
              )
          print("pyproject.toml and the tag agree on %s" % declared)
          EOF

      # working-directory is given per step rather than as a job-level
      # defaults.run block. The two artefact steps below resolve their paths from
      # the workspace root whatever defaults.run says, so a job-level default
      # would read as though it covered them when it does not. Naming the
      # directory on each step that honours it, and writing the paths out in full
      # on the steps that do not, keeps that difference visible.
      - name: Build the sdist and wheel
        working-directory: python_workflow
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the distribution
        working-directory: python_workflow
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python_workflow/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lexsync/
    # A job-level block replaces the top-level one rather than extending it, so
    # contents: read is restated here alongside the OIDC scope that trusted
    # publishing needs.
    permissions:
      contents: read
      id-token: write
    steps:
      # This job never checks the repository out, so python_workflow/ exists here
      # only because the download creates it. The artefact is unpacked under the
      # same path it was built at, so the directory is spelled the same way in
      # both jobs and a reader does not have to notice it moved.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: python_workflow/dist/

      # packages-dir is stated because the publishing action resolves it from the
      # workspace root and takes no notice of working-directory or defaults.run.
      # Leaving it out would send the action looking in ./dist, which in a
      # monorepo whose package sits in a subdirectory is empty.
      #
      # skip-existing lets a release finish when its files are already on PyPI, as
      # they are when the release event follows a manual run on the same tag, or
      # when "Re-run all jobs" rebuilds after an upload that stopped part-way.
      # PyPI accepts a byte-identical file a second time anyway, so the flag only
      # changes the outcome when a file of the same name is there with different
      # bytes. It then skips that file by name without comparing contents, and
      # the run still finishes green. The tag check above refuses a wrong version
      # number, but it cannot tell a second build of a number already on PyPI from
      # the first, so after a rebuild check the files on pypi.org.
      #
      # Pinned to a commit rather than the v1.14.2 tag, on the same reasoning as
      # the r-lib pins in python-tests.yaml. A tag can be moved to point at
      # different code, and this is the one job in the repository holding a
      # credential that can publish under the project's name. The version is kept
      # in the trailing comment so the pin can still be read and updated.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: python_workflow/dist/
          skip-existing: true
