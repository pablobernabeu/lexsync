[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexsync"
version = "0.1.1"
description = "Lexical optimisation and hardware-timed experiment generation"
readme = "README.md"
requires-python = ">=3.10"
# The wheel ships the example lexica under src/lexsync/data, which are wordfreq
# derivatives under CC BY-SA 4.0 rather than MIT, so the SPDX expression for the
# distribution as a whole names both. LICENSE.note carries the terms and the
# attribution they require, and is shipped alongside LICENSE for that reason.
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSE.note"]
authors = [{ name = "Pablo Bernabeu", email = "pcbernabeu@gmail.com" }]
keywords = [
  "psycholinguistics", "lexical statistics", "stimulus matching",
  "counterbalancing", "pseudoword generation", "EEG", "ERP",
  "PsychoPy", "OpenSesame", "jsPsych", "FAIR",
]
# No "License :: ..." classifier belongs in this list, and adding one would stop
# the release dead. Under PEP 639 the classifier and the License-Expression above
# are mutually exclusive, and PyPI rejects the upload of any distribution that
# carries both. scopusflow's pyproject.toml still pairs them, so that is not the
# file to copy this list from.
#
# The five interpreter lines are the five the test matrix runs, on Linux, macOS
# and Windows alike, so each one states something CI has checked. Alpha is the
# trove equivalent of the experimental lifecycle badge the README carries, and it
# is what all four siblings declare. "Typing :: Typed" goes with the py.typed
# marker inside src/lexsync, which is what makes a type checker read the
# annotations instead of treating the whole package as untyped.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "rapidfuzz>=3.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
corpora = ["wordfreq>=3.0,<4"]   # frozen 3.x line: a stable ~2021 language snapshot
# The extra tracks PsychoPy's own supported Python range, which has always sat a
# release or two behind the newest interpreter: the 2024.1 line declared <3.11,
# 2025.2 moved to <3.12, and the current 2026.2.3 declares >=3.10,<3.13. Python
# 3.13 therefore has no PsychoPy at all. The floor earns its place because
# without it pip back-solves past every capped release down to 2022.2.4, whose
# dependencies still include pyo, dukpy and an uncapped pyWinhook, and the
# install then dies part-way through a swig build having installed nothing at
# all. With the floor, pip stops at the top and reports that it cannot find a
# distribution for psychopy>=2024.1, which names the actual problem.
#
# An environment marker was tried and rejected. Writing
# psychopy>=2024.1; python_version < "3.13" makes the requirement evaluate away
# on 3.13, so pip installs pyserial, reports success and exits 0. The user finds
# PsychoPy missing only later, when a generated experiment fails to run. A loud
# failure at install time is the lesser harm.
#
# One combination resolves and still compiles. On Windows with Python 3.12,
# pyWinhook, which PsychoPy requires there, publishes no cp312 wheel, so it is
# built from its sdist and needs swig on PATH. 3.10 and 3.11 ship cp310 and
# cp311 wheels and install clean.
experiment = ["psychopy>=2024.1", "pyserial>=3.5"]
# streamlit backs test_apps.py: without it those tests importorskip themselves and
# the app they cover goes unguarded in CI, so it belongs with the rest of what the
# suite needs to run.
dev = ["pytest>=7.0", "build", "twine", "streamlit>=1.30"]

[project.scripts]
lexsync = "lexsync.cli:main"

[project.urls]
# Homepage, Repository (an alias of Source), Documentation, Changelog and Issues
# are well-known labels in the packaging specification, which PyPI shows with
# their own icons in the sidebar, so each is spelled the way the specification
# expects. "R twin" is not one of them and appears as a plain link. The
# changelog points at the documentation page instead of the file at the root of
# the monorepo because that page includes CHANGELOG.md verbatim through the
# snippets extension, so the two cannot disagree, and a reader arriving from PyPI
# lands on a rendered page beside the rest of the documentation. Every address
# sits under the repository's github.com or github.io paths, which PyPI can mark
# as verified for a package uploaded through trusted publishing.
Homepage = "https://github.com/pablobernabeu/lexsync"
Repository = "https://github.com/pablobernabeu/lexsync"
Documentation = "https://pablobernabeu.github.io/lexsync/python/"
Changelog = "https://pablobernabeu.github.io/lexsync/python/changelog/"
Issues = "https://github.com/pablobernabeu/lexsync/issues"
"R twin" = "https://pablobernabeu.github.io/lexsync/r/"

[tool.ruff]
line-length = 110
# The declared floor, so ruff never proposes syntax the oldest supported
# interpreter cannot run.
target-version = "py310"
# The template trees are not modules. They are payload text: OpenSesame inline
# scripts, which the host runs with Canvas, var, clock and send_trigger already
# in the namespace, and PsychoPy templates whose ALL_CAPS placeholders are
# substituted before anything executes. Linting them as importable Python
# reports every one of those as an undefined name -- 22 of them, which is every
# F finding this package has -- and each is a false positive by construction.
# They are held to their own standard instead: tests/test_templates.py and the R
# twin pin all three copies byte-identical to templates/ at the repository root.
extend-exclude = ["src/lexsync/templates"]

[tool.ruff.lint]
# Stated rather than inherited, because ruff's defaults move: 0.16 widened them
# and turned a sibling package's green CI red without a line of that package
# changing.
#
# F, E9 and B: the rules that catch bugs rather than style. Undefined names,
# unused imports and variables, redefined functions, f-strings missing their
# placeholders, syntax errors, and the bugbear set. This package had no linter at
# all, so these came first and the file passes them, which means from here it can
# only go red for a real regression.
#
# B905 was the reason B was worth enabling. Every zip() in this package pairs
# sequences that are equal in length by construction -- columns of one frame,
# or a list built from the thing it is zipped against -- so each now says
# strict=True. That is a no-op while the invariant holds and an exception the
# moment it stops holding, which matters most in counterbalancing.py and
# scripting.py, where the zipped values build the hash keys behind the
# deterministic shuffle and the jitter. Silent truncation there would not raise;
# it would quietly deal a different experiment. Adding it changed no output:
# the suite and a full pipeline run over 242 artefacts are byte-identical.
#
# E, W, I and UP are enforced too, so this package is now held to the same set
# as its four siblings. Three rules are turned off, each because the thing it
# objects to is carrying meaning rather than costing anything:
#
#   UP031 would rewrite every %-format as an f-string. This package is one half
#     of a pair, and the R half formats with sprintf; io_utils.py's
#     '"%.17g" % f' sits opposite sprintf("%.17g", ...) in R/io_utils.R, and
#     scripting.py builds TRIGGER_HOLD_MS and ASSUMED_REFRESH_HZ the same way,
#     values that reach the experiment templates and underpin the byte-identity
#     of the two engines. The twins are written to look alike so a reader can
#     see they agree rather than take it on trust. Converting the handful that
#     are load-bearing is out of the question, and converting only the rest
#     would leave one file speaking two dialects.
#   E702 objects to the semicolon in `x = ...; y = ...`. Every instance is a
#     symmetric pair -- x and y, i and j, wi and wj, cond and ref -- where the
#     two halves are one operation on a pair of things. Splitting them across
#     thirty-four lines would hide the symmetry that the single line shows.
#   E741 objects to `l`. In counterbalancing.py it is the list number, and
#     R/counterbalancing.R writes `for (l in seq_len(n_lists))` for the same
#     loop. It is domain vocabulary shared with the twin, not a careless name.
#     theoryforge's pyproject.toml disables this rule for the same reason.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP031", "E702", "E741"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexsync"]

[tool.hatch.build.targets.sdist]
# LICENSE.note is listed as well as declared under license-files, so the sdist
# carries the data terms whether or not the backend expands that declaration.
#
# tests is here because the sdist is what conda-forge, Debian and Nix build from,
# and a packager who receives no suite can do nothing more than import the module
# and hope. The 37 files it adds include the tests that pin values the R twin
# computes, many of them bit for bit, and those are the only check a build from
# the sdist gets that this engine still agrees with R. That agreement is
# precisely what a rebuild on an unfamiliar platform might disturb. The
# comparisons of whole artefacts with the R engine's output, test_parity.py and
# test_byte_parity.py, need the rest of the repository and skip there, as does
# every other test that reads it. tests/helper_repo.py says how they tell the
# repository from whatever else surrounds the unpacked sdist.
#
# depictr-py does the opposite and names an exclude list, letting hatchling ship
# everything else that is tracked. That is shorter to write but wrong here: this
# directory also holds docs/, overrides/, mkdocs.yml, run_pipeline.py and three
# requirements files, none of which belong in a distribution, and every one of
# them would have to be listed to keep it out. An include list only ever ships
# what it names, so forgetting an entry costs a missing file, and forgetting one
# in an exclude list costs a tarball quietly twice the size it should be.
include = ["src/lexsync", "tests", "README.md", "LICENSE", "LICENSE.note", "pyproject.toml"]
