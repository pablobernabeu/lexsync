[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexsync"
version = "0.1.0"
description = "Multidimensional lexical optimisation and hardware-timed experiment generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Bernabeu" }]
keywords = [
  "psycholinguistics", "lexical statistics", "stimulus matching",
  "counterbalancing", "pseudoword generation", "EEG", "ERP",
  "PsychoPy", "OpenSesame", "jsPsych", "FAIR",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "rapidfuzz>=3.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
corpora = ["wordfreq>=3.0,<4"]   # frozen 3.x line: a stable ~2021 language snapshot
experiment = ["psychopy", "pyserial"]
# streamlit backs test_apps.py: without it those tests importorskip themselves and
# the app they cover goes unguarded in CI, so it belongs with the rest of what the
# suite needs to run.
dev = ["pytest>=7.0", "build", "twine", "streamlit>=1.30"]

[project.scripts]
lexsync = "lexsync.cli:main"

[project.urls]
Homepage = "https://github.com/pablobernabeu/lexsync"
Documentation = "https://pablobernabeu.github.io/lexsync/python/"
Issues = "https://github.com/pablobernabeu/lexsync/issues"
"R twin" = "https://pablobernabeu.github.io/lexsync/r/"

[tool.ruff]
line-length = 110
# The declared floor, so ruff never proposes syntax the oldest supported
# interpreter cannot run.
target-version = "py310"
# The template trees are not modules. They are payload text: OpenSesame inline
# scripts, which the host runs with Canvas, var, clock and send_trigger already
# in the namespace, and PsychoPy templates whose ALL_CAPS placeholders are
# substituted before anything executes. Linting them as importable Python
# reports every one of those as an undefined name -- 22 of them, which is every
# F finding this package has -- and each is a false positive by construction.
# They are held to their own standard instead: tests/test_templates.py and the R
# twin pin all three copies byte-identical to templates/ at the repository root.
extend-exclude = ["src/lexsync/templates"]

[tool.ruff.lint]
# Stated rather than inherited, because ruff's defaults move: 0.16 widened them
# and turned a sibling package's green CI red without a line of that package
# changing.
#
# F, E9 and B: the rules that catch bugs rather than style. Undefined names,
# unused imports and variables, redefined functions, f-strings missing their
# placeholders, syntax errors, and the bugbear set. This package had no linter at
# all, so these came first and the file passes them, which means from here it can
# only go red for a real regression.
#
# B905 was the reason B was worth enabling. Every zip() in this package pairs
# sequences that are equal in length by construction -- columns of one frame,
# or a list built from the thing it is zipped against -- so each now says
# strict=True. That is a no-op while the invariant holds and an exception the
# moment it stops holding, which matters most in counterbalancing.py and
# scripting.py, where the zipped values build the hash keys behind the
# deterministic shuffle and the jitter. Silent truncation there would not raise;
# it would quietly deal a different experiment. Adding it changed no output:
# the suite and a full pipeline run over 242 artefacts are byte-identical.
#
# E, W, I and UP are enforced too, so this package is now held to the same set
# as its four siblings. Three rules are turned off, each because the thing it
# objects to is carrying meaning rather than costing anything:
#
#   UP031 would rewrite every %-format as an f-string. This package is one half
#     of a pair, and the R half formats with sprintf; io_utils.py's
#     '"%.17g" % f' sits opposite sprintf("%.17g", ...) in R/io_utils.R, and
#     scripting.py builds TRIGGER_HOLD_MS and ASSUMED_REFRESH_HZ the same way,
#     values that reach the experiment templates and underpin the byte-identity
#     of the two engines. The twins are written to look alike so a reader can
#     see they agree rather than take it on trust. Converting the handful that
#     are load-bearing is out of the question, and converting only the rest
#     would leave one file speaking two dialects.
#   E702 objects to the semicolon in `x = ...; y = ...`. Every instance is a
#     symmetric pair -- x and y, i and j, wi and wj, cond and ref -- where the
#     two halves are one operation on a pair of things. Splitting them across
#     thirty-four lines would hide the symmetry that the single line shows.
#   E741 objects to `l`. In counterbalancing.py it is the list number, and
#     R/counterbalancing.R writes `for (l in seq_len(n_lists))` for the same
#     loop. It is domain vocabulary shared with the twin, not a careless name.
#     theoryforge's pyproject.toml disables this rule for the same reason.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP031", "E702", "E741"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexsync"]

[tool.hatch.build.targets.sdist]
include = ["src/lexsync", "README.md", "LICENSE", "pyproject.toml"]
