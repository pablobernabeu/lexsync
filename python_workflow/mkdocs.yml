site_name: lexsync (Python)
site_description: Lexical optimisation and hardware-timed experiment generation. Select matched stimuli from a corpus in any of dozens of languages and generate the experiment that presents them.
site_author: Pablo Bernabeu
site_url: https://pablobernabeu.github.io/lexsync/python/
repo_url: https://github.com/pablobernabeu/lexsync
# The licence link is absolute: the copyright line renders on every page, and a
# relative link would resolve against nested pages and break.
# The badges are this package's own (see README.md): the continuous-integration
# workflow that checks the Python engine, the lifecycle stage and the source licence.
# The R package's R-CMD-check badge is not among them, even though the two engines
# share a repository, because this site documents the Python half and a reader here
# would take a red badge as a failure of the code they are reading about. Every other
# Python site in the family shows only its own workflow. There is no Zenodo DOI badge,
# because lexsync has no deposited DOI (see CITATION.cff).
copyright: >-
  <span class="mrd-footer-badges">
  <a href="https://github.com/pablobernabeu/lexsync/actions/workflows/python-tests.yaml"><img src="https://github.com/pablobernabeu/lexsync/actions/workflows/python-tests.yaml/badge.svg" alt="python-tests"></a>
  <a href="https://lifecycle.r-lib.org/articles/stages.html#experimental"><img src="https://img.shields.io/badge/lifecycle-experimental-orange.svg" alt="Lifecycle: experimental"></a>
  <a href="https://opensource.org/license/MIT"><img src="https://img.shields.io/badge/license-MIT-blue.svg" alt="License: MIT"></a>
  </span>
  Developed by <a href="https://pablobernabeu.github.io">Pablo Bernabeu</a>.
  Open, reproducible research software in R and Python. Released under the
  <a href="https://pablobernabeu.github.io/lexsync/python/licence/">MIT licence</a>.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  # The motif alone, not the full logo. A browser tab is 16-32px, where the wordmark
  # renders as an illegible smudge; the two coloured entries and the single pale exit
  # still read at that size, which is what the mark was drawn for. The R site's PNG
  # favicons have always been motif-only, so this also makes the two sites agree.
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  # The header and footer are held at the deep-navy brand ink in both schemes
  # (primary: black is the closest preset, retuned to the exact navy in
  # stylesheets/brand.css); accent carries the warm amber.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css

# The demonstration experiment is reached through the header pill
# (overrides/partials/header.html), matching the family convention, so it does not
# repeat in the nav. The first three guides follow the workflow arc, from selecting
# stimuli to presenting them, then to the guarantees that hold across both engines,
# and are the twins of the R package's vignettes of the same names. The app guide
# comes after them because it covers the same ground without code, and it stays
# ahead of References, which is a bibliography rather than a stage of the workflow.
# The R package's Articles menu lists the same pages in the same order.
nav:
  - Home: index.md
  - Get started: getting-started.md
  - API reference: api.md
  - Guides:
      - Matching and designs: matching-and-designs.md
      - Experiments and triggers: experiments-and-triggers.md
      - Reproducibility and parity: reproducibility-and-parity.md
      - The app: the-app.md
      - References: references.md
  - Changelog: changelog.md
  - About: about.md

plugins:
  - search
  # Runs the example blocks at build time and embeds their real output, so the
  # guides show results like a knitted R vignette and cannot drift from the code.
  # Unlike mkdocstrings below, this imports lexsync the ordinary way, so the
  # package has to be importable when the site is built: the docs workflow does
  # `pip install -e ./python_workflow`, and a local build without that needs
  # PYTHONPATH=src.
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          # Relative to this file, so the documented objects are the ones in this
          # working tree rather than whatever lexsync happens to be installed.
          paths: [src]
          options:
            show_root_heading: true
            docstring_style: google
            # api.md groups 47 objects under eleven h2 sections, mirroring the R
            # package's reference index. At mkdocstrings' default level the object
            # headings would also be h2, flattening the table of contents into one
            # list in which no object shows which group it belongs to.
            heading_level: 3

markdown_extensions:
  - admonition
  # Heading anchors, so any section of a guide or of the API reference can be
  # linked directly. Without this the built pages carry no headerlink at all.
  - toc:
      permalink: true
  - pymdownx.highlight:
      # Tag each block with its language, so brand.css can tell output pasted
      # into a `text` fence from a source block and style it as output.
      pygments_lang_class: true
  - pymdownx.superfences
  # attr_list carries the classes that brand.css styles: the home page's call-to-action
  # buttons (.md-button) and the tagline under the title (.mrd-tagline). Without it the
  # attribute lists render as literal braces.
  - attr_list
  # Snippets embeds the repository's LICENSE and CHANGELOG.md into the licence and
  # changelog pages, so neither page can drift from the file it reports.
  # pymdown-extensions ships with mkdocs-material. base_path is listed explicitly
  # because the two files sit at different levels: LICENSE beside this config, the
  # changelog at the root of the monorepo, which the default base_path never reaches.
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
        - ..

# Build with:  pip install mkdocs-material "mkdocstrings[python]" && mkdocs build

# The released version shown beside the title in the header (updated on release).
# It tracks pyproject.toml's version, and the R package is released in lockstep.
extra:
  version: "0.1.0"
