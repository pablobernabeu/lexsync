url: https://pablobernabeu.github.io/lexsync/r

# The R package lives in a subdirectory of the monorepo (R_workflow/), not at the
# repository root. Left to auto-detect from DESCRIPTION's URL field, pkgdown's
# per-file "Source: <path>" links (function reference pages, NEWS.md) resolve one
# level too high and 404. Point the source template at the package's actual
# subdirectory; the repo and issue links stay at the root, which is correct for
# those.
repo:
  url:
    home: https://github.com/pablobernabeu/lexsync/
    source: https://github.com/pablobernabeu/lexsync/blob/main/R_workflow/
    issue: https://github.com/pablobernabeu/lexsync/issues/
    user: https://github.com/

template:
  bootstrap: 5
  # Not cosmetic. light-switch is what makes pkgdown ship lightswitch.js, which
  # stamps data-bs-theme on <html>; every [data-bs-theme] rule in pkgdown/extra.scss
  # depends on it, and the page falls back to plain Bootstrap without it.
  light-switch: true
  bslib:
    primary: "#7C4EA3"
  # Fonts are loaded as a plain stylesheet link (Spectral for headings, Inter for
  # body, JetBrains Mono for code) and applied in pkgdown/extra.scss. This avoids
  # bslib's build-time font download and keeps the brand identical to the mkdocs
  # twin and the rest of the package family.
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

authors:
  Pablo Bernabeu:
    href: https://pablobernabeu.github.io/

footer:
  structure:
    left: [developed_by]
    right: [legal, built_with]
  components:
    developed_by: >
      Developed by [Pablo Bernabeu](https://pablobernabeu.github.io). Open,
      reproducible research software in R and Python.
    # LICENSE-text.html, not LICENSE.html. pkgdown renders LICENSE.html only from a
    # LICENSE.md; from a plain LICENSE file (what this package has) it renders
    # LICENSE-text.html, so LICENSE.html would 404.
    legal: >
      Released under the [MIT licence](LICENSE-text.html).

home:
  sidebar:
    # No community row: lexsync has no .github/CONTRIBUTING.md, and pkgdown would
    # link a page it never builds.
    structure: [links, license, cite, authors, dev]
    components:
      # One British-spelled licence link. pkgdown's default licence section renders
      # the raw "MIT + file LICENSE" field, which reads as more than one licence;
      # this collapses it to a single link. See the footer note on LICENSE-text.html.
      license:
        title: Licence
        text: >
          [MIT licence](LICENSE-text.html)
      # Dropping the built-in "citation" from the structure and supplying a custom
      # "cite" component is more reliable than overriding the built-in in place.
      # There is no inst/CITATION and no deposited DOI, so this points at the
      # CITATION.cff that does exist, at the root of the monorepo.
      cite:
        title: Citation
        text: |
          [How to cite lexsync](https://github.com/pablobernabeu/lexsync/blob/main/CITATION.cff)

          A manuscript describing lexsync is in preparation.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [demo, search, github, lightswitch]
  components:
    # A generated experiment, not an app: lexsync has no webR build, and the Shiny
    # and Streamlit apps are server-side. This is the jsPsych export of the English
    # lexical-decision design, which is a single self-contained HTML file and so can
    # be published beside the site. The fa-play icon is what pkgdown/extra.scss
    # styles into the amber pill.
    demo:
      text: Demo
      href: https://pablobernabeu.github.io/lexsync/demos/en_lexdec_english.html
      icon: fa-play
      aria-label: A generated lexical-decision experiment, running in the browser
    # Curated with explicit links (href strings, so no tidyselect evaluation of
    # hyphenated slugs). "Get started" is omitted deliberately: it is the intro
    # navbar item, built from vignettes/lexsync.Rmd. Ordered along the workflow
    # arc, from selecting stimuli to presenting them, then to the guarantees that
    # hold across both engines.
    articles:
      text: Articles
      menu:
      - text: Matching and designs
        href: https://pablobernabeu.github.io/lexsync/r/articles/matching-and-designs.html
      - text: Experiments and triggers
        href: https://pablobernabeu.github.io/lexsync/r/articles/experiments-and-triggers.html
      - text: Reproducibility and parity
        href: https://pablobernabeu.github.io/lexsync/r/articles/reproducibility-and-parity.html

# Every exported topic appears in exactly one section; pkgdown::check_pkgdown()
# errors otherwise. The order follows the pipeline, from corpus to published
# materials. lexsync-package is absent by design: roxygen marks it internal.
reference:
- title: Corpora and lexica
  desc: Reach a word-frequency corpus in any registered language, and read it in.
  contents:
  - list_corpora
  - fetch_corpus
  - lexsync_cache_dir
  - load_lexicon
  - load_items
  - merge_norms
- title: Lexical dimensions
  desc: Derive the dimensions that stimuli are later matched or controlled on.
  contents:
  - add_neighbourhood
  - add_bigram_frequency
  - count_syllables
- title: Pools and matching
  desc: Filter a lexicon to a candidate pool, then match conditions across dimensions in parallel.
  contents:
  - build_pool
  - match_stimuli
  - resample_stimuli
- title: Continuous designs
  desc: Span a predictor instead of dichotomising it, holding the control dimensions constant.
  contents:
  - select_continuous_stimuli
  - match_report_continuous
- title: Pseudoword generation
  desc: Deterministic non-words, and the lexical-decision sets built from them.
  contents:
  - generate_pseudowords
  - make_pseudoword
  - build_lexdec_stimuli
- title: Paradigms and trial events
  desc: The declarative trial model, and the fields a design must supply to it.
  contents:
  - PARADIGMS
  - resolve_events
  - required_fields
- title: Counterbalancing
  desc: Rotate items across lists and assign participants to them.
  contents:
  - counterbalance
  - participant_table
- title: Validation and equivalence
  desc: Report the realised control, testing for equivalence rather than for a null result.
  contents:
  - match_report
  - describe_stimuli
  - balance_check
  - variance_ratio
  - cohens_d
  - cohens_d_ci
  - tost_equiv
- title: Experiment generation
  desc: Render the events into runnable experiments, with EEG triggers on the laboratory targets.
  contents:
  - export_experiments
  - export_psychopy
  - export_opensesame
  - export_jspsych
  - assign_triggers
- title: Materials datasheet
  desc: The provenance, checksums and realised control that travel with a stimulus set.
  contents:
  - build_datasheet
  - write_datasheet
  - methods_paragraph
- title: Pipeline and logging
  desc: Run a design end to end, and log every step and artefact as it is written.
  contents:
  - run_pipeline
  - run_all
  - new_run_log
  - log_step
  - log_artefact
  - write_run_log
